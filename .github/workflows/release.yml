name: Release veröffentlichen

# #488 Phase 2: nur von Hand und nur nach ausdrücklicher Freigabe
# („Release <version> freigeben und veröffentlichen“). Legt Tag und
# GitHub-Release an und veröffentlicht die Dokumentationswebsite.
# Ein erneuter Start setzt fort: vorhandener Tag bzw. Release bleibt unverändert.
# Pre-release (#488): mit `prerelease: N` vom Branch release/<version> starten
# („Pre-release <version>-rc.N freigeben“). Tag v<X.Y>-rc.N, GitHub-Release als
# Vorabversion, keine Website; main und damit die Bücher bleiben unverändert.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version wie im Manifest, z. B. 1.0.0'
        required: true
      confirm:
        description: 'Zur Bestätigung die Version noch einmal eingeben'
        required: true
      prerelease:
        description: 'Pre-release: Nummer N für <version>-rc.N (nur vom Branch release/<version>); leer = endgültiges Release'
        required: false
        default: ''
      dry_run:
        description: 'Trockenlauf: alles prüfen und bauen, nichts anlegen oder veröffentlichen'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'ploeffler/GhostWriter' &&
      ((inputs.prerelease == '' && github.ref == 'refs/heads/main') ||
       (inputs.prerelease != '' && startsWith(github.ref, 'refs/heads/release/')))
    runs-on: ubuntu-latest
    # Die Umgebung github-pages lässt nur main zu; eine Vorabversion braucht sie nicht.
    environment:
      name: ${{ inputs.prerelease == '' && 'github-pages' || '' }}
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge installieren
        run: pip install -r scripts/docsite/requirements.txt
      - name: Freigabe prüfen (Version, Bestätigung, Release Notes)
        run: |
          python scripts/release.py check --version "$VERSION" --confirm "${{ inputs.confirm }}" \
            --prerelease "$PRERELEASE" --ref "$GITHUB_REF_NAME"
      - name: Tag und Release Notes vorbereiten
        id: prep
        run: |
          TAG=$(python scripts/release.py tag --version "$VERSION" --prerelease "$PRERELEASE")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python scripts/release.py notes --version "$VERSION" > "$RUNNER_TEMP/notes.md"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n1 "$TAG")" != "$GITHUB_SHA" ]; then
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                echo "::warning::Tag $TAG zeigt auf einen anderen Commit; ein echter Lauf würde hier abbrechen."
              else
                echo "::error::Tag $TAG zeigt auf einen anderen Commit; nichts geändert."; exit 1
              fi
            fi
            echo "Tag $TAG ist schon da (gleicher Commit)."
          fi
      - name: Dokumentationswebsite bauen und prüfen
        if: ${{ inputs.prerelease == '' }}
        run: python scripts/package_docs_site.py
      - name: Tag und GitHub-Release anlegen
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ist schon da."
          else
            if [ -n "$PRERELEASE" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "GhostWriter $VERSION-rc.$PRERELEASE (Vorabversion)" --notes-file "$RUNNER_TEMP/notes.md"
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "GhostWriter $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          fi
      - uses: actions/configure-pages@v5
        if: ${{ !inputs.dry_run && inputs.prerelease == '' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.dry_run && inputs.prerelease == '' }}
        with:
          path: build/pages
      - name: GitHub Pages bereitstellen
        id: deployment
        if: ${{ !inputs.dry_run && inputs.prerelease == '' }}
        uses: actions/deploy-pages@v4
      - name: Öffentliche Website nachprüfen
        if: ${{ !inputs.dry_run && inputs.prerelease == '' }}
        run: |
          for i in 1 2 3 4 5 6; do
            python scripts/release.py site --version "$VERSION" && exit 0
            sleep 20
          done
          echo "::error::Tag und Release da, Website zeigt die neue Version nicht. Erneut starten setzt fort."; exit 1
      - name: Ergebnis
        if: always()
        run: |
          {
            echo "## Release $VERSION"
            echo "- Trockenlauf: ${{ inputs.dry_run }}"
            echo "- Pre-release: ${{ inputs.prerelease || 'nein' }}"
            echo "- Tag: ${{ steps.prep.outputs.tag }}"
            echo "- Website: ${{ steps.deployment.outputs.page_url || 'nicht veröffentlicht' }}"
          } >> "$GITHUB_STEP_SUMMARY"
