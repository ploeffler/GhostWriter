name: Übersichtsdatei aktualisieren

# Erzeugt ghostwriter-index.json (scripts/build_index.py) nach jedem Push, der
# Buchdateien ändert, und committet sie nur, wenn sich etwas geändert hat.
# Commits mit GITHUB_TOKEN lösen keine weiteren Workflows aus, es gibt also
# keine Schleife. Ohne Kapitel (Starter) entsteht keine Datei.

on:
  push:
    paths:
      - 'ghostwriter.yml'
      - 'chapters/**'
      - 'matter/**'
      - 'characters/**'
      - 'costs/**'
      - 'scripts/build_index.py'
      - 'scripts/render_view.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install pyyaml

      - name: Übersichtsdatei erzeugen
        # SECRETS_PRESENT: je bekanntem Namen nur, ob das Secret hinterlegt ist (true/false);
        # Werte gelangen nie in den Lauf. Nicht toJSON(secrets): Das lässt GitHub Läufe in
        # öffentlichen Repositorys als verdächtig anhalten. Block: scripts/secret_check.py block
        env:
          SECRETS_PRESENT: >-
            {"ANTHROPIC_API_KEY": ${{ secrets.ANTHROPIC_API_KEY != '' }},
             "AWS_BEDROCK_API_KEY": ${{ secrets.AWS_BEDROCK_API_KEY != '' }},
             "AZURE_AI_FOUNDRY_API_KEY": ${{ secrets.AZURE_AI_FOUNDRY_API_KEY != '' }},
             "BRAVE_API_KEY": ${{ secrets.BRAVE_API_KEY != '' }},
             "CLAUDE_CODE_OAUTH_TOKEN": ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }},
             "COHERE_API_KEY": ${{ secrets.COHERE_API_KEY != '' }},
             "DASHSCOPE_API_KEY": ${{ secrets.DASHSCOPE_API_KEY != '' }},
             "DEEPSEEK_API_KEY": ${{ secrets.DEEPSEEK_API_KEY != '' }},
             "EXA_API_KEY": ${{ secrets.EXA_API_KEY != '' }},
             "GEMINI_API_KEY": ${{ secrets.GEMINI_API_KEY != '' }},
             "GHOSTWRITER_UPDATE_TOKEN": ${{ secrets.GHOSTWRITER_UPDATE_TOKEN != '' }},
             "GITHUB_COPILOT_AGENT_API_KEY": ${{ secrets.GITHUB_COPILOT_AGENT_API_KEY != '' }},
             "GOOGLE_JULES_API_KEY": ${{ secrets.GOOGLE_JULES_API_KEY != '' }},
             "GOOGLE_VERTEX_API_KEY": ${{ secrets.GOOGLE_VERTEX_API_KEY != '' }},
             "LOCAL_LMSTUDIO_API_KEY": ${{ secrets.LOCAL_LMSTUDIO_API_KEY != '' }},
             "LOCAL_OLLAMA_API_KEY": ${{ secrets.LOCAL_OLLAMA_API_KEY != '' }},
             "MANUAL_API_KEY": ${{ secrets.MANUAL_API_KEY != '' }},
             "META_LLAMA_API_KEY": ${{ secrets.META_LLAMA_API_KEY != '' }},
             "MICROSOFT_COPILOT_API_KEY": ${{ secrets.MICROSOFT_COPILOT_API_KEY != '' }},
             "MISTRAL_API_KEY": ${{ secrets.MISTRAL_API_KEY != '' }},
             "MOONSHOT_API_KEY": ${{ secrets.MOONSHOT_API_KEY != '' }},
             "OPENAI_API_KEY": ${{ secrets.OPENAI_API_KEY != '' }},
             "OPENALEX_API_KEY": ${{ secrets.OPENALEX_API_KEY != '' }},
             "OPENROUTER_API_KEY": ${{ secrets.OPENROUTER_API_KEY != '' }},
             "PARALLEL_API_KEY": ${{ secrets.PARALLEL_API_KEY != '' }},
             "PERPLEXITY_API_KEY": ${{ secrets.PERPLEXITY_API_KEY != '' }},
             "SEMANTIC_SCHOLAR_API_KEY": ${{ secrets.SEMANTIC_SCHOLAR_API_KEY != '' }},
             "SERPAPI_API_KEY": ${{ secrets.SERPAPI_API_KEY != '' }},
             "TAVILY_API_KEY": ${{ secrets.TAVILY_API_KEY != '' }},
             "XAI_API_KEY": ${{ secrets.XAI_API_KEY != '' }}}
        run: python scripts/build_index.py .

      - name: Bei Änderungen committen
        run: |
          git add ghostwriter-index.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Übersichtsdatei unverändert"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Übersichtsdatei aktualisiert" -m "GhostWriter-Aktion: index.build"
          # Kam inzwischen ein neuer Push, darauf aufsetzen; bei einem Konflikt
          # auslassen, der Lauf für den neuen Push erzeugt die Datei ohnehin neu.
          if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
            git rebase --abort
            echo "::warning::Übersichtsdatei nicht gepusht, ein neuerer Lauf erzeugt sie neu"
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
