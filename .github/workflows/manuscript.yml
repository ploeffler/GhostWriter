name: Manuskript ausgeben

# „Manuskript ausgeben“ (#260): ein PDF des Arbeitsstands. Abschnitte mit Text wie im
# Probedruck, Abschnitte ohne Text als Kasten „Geplant“ mit dem geplanten Inhalt in
# Stichworten (ohne KI, scripts/assemble.py). Kein Tag, kein Release: Das PDF steht
# 14 Tage als Artifact am Lauf; der Chat holt es dort ab und übergibt es als Datei.
# Gestartet aus dem Chat (Befehl „Manuskript ausgeben“, Aktion manuscript.export) oder
# unter Actions → Manuskript ausgeben → Run workflow (Use workflow from = Buch-Branch).
#
# format=md (Lesefassung, #289 Teil 2): ein Kapitel (5) oder Abschnitt (5.1) als lesbares
# Markdown (scripts/assemble.py reading), ohne TeX. Für Clients, die selbst kein Skript
# ausführen können (ChatGPT mit GitHub-Connector, Open WebUI): Die Datei landet zusätzlich
# auf dem Branch lesefassung/<buch> (nur Lesefassungen, wird nie gemergt) und ist dort über
# den GitHub-Zugang lesbar. Start mit ref = Arbeits-Branch, wenn es offene Änderungen gibt.
# Commits mit GITHUB_TOKEN lösen keine weiteren Workflows aus. Nie das ganze Buch.

on:
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Nur dieses Kapitel (Nummer); leer = ganzes Buch. Bei md: Kapitel (5) oder Abschnitt (5.1), Pflicht'
        required: false
        default: ''
      format:
        description: 'pdf = Manuskript als PDF; md = Lesefassung eines Kapitels oder Abschnitts (#289)'
        type: choice
        options: [pdf, md]
        default: pdf

permissions:
  contents: write   # nur format=md: Lesefassung auf lesefassung/<buch>

concurrency:
  group: manuscript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Serie (#116): Standard-Branch und andere Bände

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lesefassung (md)
        if: inputs.format == 'md'
        env:
          KEY: ${{ inputs.chapter }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          pip install -q pyyaml
          case "$KEY" in
            ''|*[!0-9.]*|.*|*.|*.*.*) echo "::error::Lesefassung braucht ein Kapitel (5) oder einen Abschnitt (5.1), nie das ganze Buch: '$KEY'"; exit 1 ;;
          esac
          mkdir -p lesefassung
          python scripts/assemble.py . reading "$KEY" -o lesefassung --date "$(date -u +%F)"
          file=$(ls lesefassung/*.md); name=$(basename "$file")
          book=${REF_NAME#ghostwriter/}; book=${book#buch/}; book=$(echo "$book" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
          target="lesefassung/$book"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch -q origin "refs/heads/$target:refs/remotes/origin/$target" 2>/dev/null; then
            git worktree add -q -B lf-out out "origin/$target"
          else
            git worktree add -q --detach out
            git -C out checkout -q --orphan lf-out
            git -C out rm -rqf .
            printf '%s\n' '# Lesefassungen' '' 'Automatisch erzeugt von „Manuskript ausgeben“ (format md, #289). Nur zum Lesen; dieser Branch wird nie gemergt.' > out/README.md
          fi
          cp "$file" "out/$name"
          git -C out add -A
          git -C out commit -qm "Lesefassung $KEY (Stand ${GITHUB_SHA:0:7} auf $REF_NAME)" || echo "unverändert"
          git -C out push -q origin "HEAD:refs/heads/$target"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$target/$name"
          {
            echo "## Lesefassung"
            echo
            echo "Stand \`${GITHUB_SHA:0:7}\` auf \`$REF_NAME\`: [$name]($url) (Branch \`$target\`, Datei \`$name\`). Zusätzlich unten unter **Artifacts** (14 Tage)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "LESEFASSUNG: $target $name"

      - uses: actions/upload-artifact@v4
        if: inputs.format == 'md'
        with:
          name: lesefassung
          path: lesefassung/*.md
          retention-days: 14

      - name: Abhängigkeiten
        if: inputs.format != 'md'
        run: |
          pip install pyyaml jsonschema
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pandoc texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-lang-german texlive-fonts-recommended fonts-texgyre lmodern >/dev/null

      - name: Manuskript bauen
        if: inputs.format != 'md'
        env:
          CHAPTER: ${{ inputs.chapter }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CHAPTER" in
            '') extra=() ;;
            *[!0-9]*) echo "Kapitel muss eine Nummer sein: $CHAPTER"; exit 1 ;;
            *) extra=(--chapter "$CHAPTER") ;;
          esac
          python scripts/build_edition.py . --manuscript "${extra[@]}" --out manuskript --commit "$GITHUB_SHA"
          {
            echo "## Manuskript"
            echo
            echo "Stand \`${GITHUB_SHA:0:7}\` auf \`$GITHUB_REF_NAME\`${CHAPTER:+, Kapitel $CHAPTER}. Download unten unter **Artifacts** (14 Tage)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: inputs.format != 'md'
        with:
          name: manuskript
          path: manuskript/*.pdf
          retention-days: 14
