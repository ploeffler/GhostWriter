name: Bild erzeugen

# Bildentwurf über den eigenen Google-Gemini-Zugang erzeugen und freigegebene Referenzbilder tatsächlich als Bild
# übergeben (#143, Punkte 5 und 6, scripts/image_service.py). Die Fähigkeit je Dienst steht in providers.yml
# (`image_services`: Referenzbilder ja/nein, Anzahl, Formate); wo ein Dienst keine Bildreferenzen annimmt oder GhostWriter
# ihn nicht anspricht, meldet der Lauf das und bricht ab, außer `text_only_ok`: dann geht nur die Beschreibung der
# Referenzen im Text mit, und das Protokoll sagt es. Je Auftrag entstehen `bild.jpg` und `handover.yml` (Dienst, Modell,
# übergebene Referenz-IDs mit Bildversion, Übersprungenes mit Grund) unter quellen/bild-entwuerfe/ auf dem Arbeits-Branch
# ghostwriter/<buch-branch>; ein Entwurf ist kein Buchbild, Übernehmen und Freigeben bleiben eigene Schritte. Braucht das
# Secret GEMINI_API_KEY. Start von Hand (Run workflow, auf dem Buch-Branch) oder aus dem Chat.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Auftragstext für das Bild (aus `images.py prompt`)'
        required: true
      references:
        description: 'Freigegebene Referenzbild-IDs, mit Leerzeichen getrennt (optional), z. B. ref-img-opi-1'
        default: ''
      service:
        description: 'Bilddienst aus providers.yml (image_services); heute: google'
        default: 'google'
      consent:
        description: 'Die Abgebildeten bzw. die Familie sind einverstanden; die Referenzbilder gehen an den Dienst'
        type: boolean
        default: false
      text_only_ok:
        description: 'Auch ohne Übergabe der Bilder arbeiten: nur die Beschreibung der Referenzen geht im Text mit'
        type: boolean
        default: false
      model:
        description: 'Bildmodell (leer = Vorgabe aus providers.yml, model_defaults)'
        default: ''

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash   # bash -e -o pipefail: ein Fehler vor `| tee` bricht den Schritt ab

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten
        run: pip install pyyaml jsonschema

      - name: Ziel-Branch
        id: work
        env:
          BOOK: ${{ github.ref_name }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! python scripts/library.py is "$BOOK" --dir .; then
            echo "::error::$BOOK ist kein Buch. Den Lauf auf dem Buch-Branch starten."; exit 1
          fi
          target=$(python -c "import sys; sys.path.insert(0, 'scripts'); import library; print(library.work_branch(sys.argv[1]))" "$BOOK")
          if git ls-remote --exit-code --heads origin "$target" >/dev/null; then
            git fetch -q origin "$target"; git switch -q -C target "origin/$target"
          else
            git fetch -q origin "$BOOK"; git switch -q -C target "origin/$BOOK"
          fi
          git fetch -q origin "$BOOK"
          git restore --source="origin/$BOOK" --worktree -- scripts providers.yml
          git config user.name GhostWriter
          git config user.email ghostwriter@users.noreply.github.com
          echo "book=$BOOK" >> "$GITHUB_OUTPUT"
          echo "branch=$target" >> "$GITHUB_OUTPUT"

      - name: Plan (nichts wird gesendet)
        env:
          SERVICE: ${{ inputs.service }}
          REFERENCES: ${{ inputs.references }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          # shellcheck disable=SC2086
          python scripts/image_service.py . plan --service "$SERVICE" --references $REFERENCES | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Bildentwurf erzeugen
        env:
          SERVICE: ${{ inputs.service }}
          PROMPT: ${{ inputs.prompt }}
          REFERENCES: ${{ inputs.references }}
          CONSENT: ${{ inputs.consent }}
          TEXT_ONLY: ${{ inputs.text_only_ok }}
          MODEL: ${{ inputs.model }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          args=(--service "$SERVICE" --prompt "$PROMPT")
          if [ "$CONSENT" = "true" ]; then args+=(--consent); fi
          if [ "$TEXT_ONLY" = "true" ]; then args+=(--text-only-ok); fi
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          # shellcheck disable=SC2086
          python scripts/image_service.py . generate "${args[@]}" --references $REFERENCES | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Speichern
        env:
          WORK: ${{ steps.work.outputs.branch }}
        run: |
          git add quellen/bild-entwuerfe
          if git diff --cached --quiet; then echo "Nichts zu speichern"; exit 0; fi
          git commit -q -m "Bildentwurf erzeugt (Übergabe der Referenzen protokolliert)" -m "GhostWriter-Aktion: image.generate"
          for i in 1 2 3; do
            git push -q origin "HEAD:refs/heads/$WORK" && break
            git fetch -q origin "$WORK"; git rebase -q --autostash "origin/$WORK" || { git rebase --abort; exit 1; }
          done

      - name: Änderungspaket
        env:
          BOOK: ${{ steps.work.outputs.book }}
          WORK: ${{ steps.work.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --heads origin "$WORK" >/dev/null; then echo "Nichts zu speichern"; exit 0; fi
          owner=${GITHUB_REPOSITORY%%/*}
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$WORK&base=$BOOK" --jq 'length')
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BOOK...$WORK" --jq '.ahead_by')
          if [ "$open" = "0" ] && [ "${ahead:-0}" != "0" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls" -f base="$BOOK" -f head="$WORK" \
              -f title="GhostWriter: offene Änderungen" \
              -f body="Offene Änderungen aus GhostWriter. Übernommen wird erst nach Bestätigung." --jq '.html_url' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Änderungspaket: $WORK" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
