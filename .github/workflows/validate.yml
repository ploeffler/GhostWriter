name: Projektdateien prüfen

# Sparsam mit dem Actions-Kontingent (#277; privat 2000 Minuten im Monat):
# Pushes nur auf dem Standard-Branch und auf Buch-Branches (buch/*) prüfen,
# Arbeits-Branches über ihren Pull Request. Reine Bot-Ausgaben (Übersichtsdatei,
# Bücherregal) lösen keine Prüfung aus. Ein neuer Push bricht den älteren Lauf
# desselben Branchs bzw. PRs ab, auch auf dem Standard-Branch: geprüft wird der neueste Stand.
# Hauptrepository (#485): Ein grüner voller PR-Lauf hinterlegt den geprüften Baum als
# Artefakt „validate-full-<tree>“. Hat der Merge-Commit auf dem Standard-Branch genau diesen
# Baum, laufen die Tests dort nicht noch einmal (nur Schema, Doku, Website).

on:
  push:
    # Arbeits-Branches starten gar keinen Lauf (auch keinen übersprungenen): weniger
    # Läufe, weniger E-Mails von GitHub (#287). Liste wie PATTERN in cleanup.yml.
    branches-ignore: ['ghostwriter/**', 'feat/**', 'fix/**', 'docs/**', 'ui/**', 'chore/**', 'media/**', 'test/**', 'codex/**', 'claude/**', 'release/**', 'dependabot/**']
    paths-ignore:
      - 'ghostwriter-index.json'
      - 'library.json'
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read      # Meilensteine für die Roadmap-Prüfung
  actions: read     # Artefakte „validate-full-<tree>“ finden (#485)
  pull-requests: read   # geänderte Dateien für die Testauswahl (#439)

jobs:
  validate:
    # Die Bedingung wird vor dem Start ausgewertet: Übersprungene Läufe kosten keine Minuten.
    # GHOSTWRITER_ACTIONS_PAUSED: Automatik pausiert, Actions-Minuten fast aufgebraucht (#62, #277)
    if: >-
      vars.GHOSTWRITER_ACTIONS_PAUSED != 'true'
      && (github.event_name != 'push'
          || github.ref_name == github.event.repository.default_branch
          || startsWith(github.ref_name, 'buch/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install pyyaml jsonschema requests pydantic pillow numpy python-docx
          # Website-Pakete nur im Hauptrepository (Dokumentationswebsite)
          upstream=$(python -c "import yaml;print((yaml.safe_load(open('ghostwriter-manifest.yml')).get('upstream') or {}).get('repo',''))" 2>/dev/null || true)
          if [ "$upstream" = "$GITHUB_REPOSITORY" ] || [ ! -f ghostwriter-manifest.yml ]; then
            pip install -r scripts/docsite/requirements.txt
          fi

      - name: workflow.yml gegen sein Schema prüfen
        run: |
          python - <<'EOF'
          import json, yaml
          from jsonschema import Draft202012Validator
          schema = json.load(open('schemas/workflow.schema.json', encoding='utf-8'))
          data = yaml.safe_load(open('workflow.yml', encoding='utf-8'))
          errors = list(Draft202012Validator(schema).iter_errors(data))
          for e in errors:
              print(f"workflow.yml: {'/'.join(map(str, e.absolute_path))}: {e.message}")
          raise SystemExit(1 if errors else 0)
          EOF

      - name: Workflow-Semantik prüfen
        run: python scripts/check_workflow_consistency.py

      - name: Programm oder Buch?
        # Tests und Testbücher gehören zum Programm (tests/ wird nicht mit dem Update
        # verteilt); in Buch-Repositorys würden veraltete Kopien sonst fehlschlagen.
        id: kind
        run: |
          upstream=$(python -c "import yaml;print((yaml.safe_load(open('ghostwriter-manifest.yml')).get('upstream') or {}).get('repo',''))" 2>/dev/null || true)
          if [ "$upstream" = "$GITHUB_REPOSITORY" ] || [ ! -f ghostwriter-manifest.yml ]; then echo "program=1" >> "$GITHUB_OUTPUT"; fi

      - name: Testumfang bestimmen
        # Pull Requests: nur die Tests zu den geänderten Dateien, Satzpakete nur bei Bedarf (#439).
        # Im Zweifel und auf dem Standard-Branch: alle Tests (scripts/select_tests.py).
        # START.md, Vorlagen und einzelne Workflows: die Tests, die sie nennen (#485).
        if: steps.kind.outputs.program == '1'
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          files="repos/$GITHUB_REPOSITORY/pulls/$PR/files"
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          # Standard-Branch: Baum schon in einem grünen vollen PR-Lauf geprüft? Dann keine Tests (#485).
          if [ -z "$PR" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] \
             && run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=validate-full-$tree&per_page=5" \
                      --jq '[.artifacts[] | select(.expired | not) | .workflow_run.id][0] // empty' 2>/dev/null) \
             && [ -n "$run" ] \
             && [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion 2>/dev/null)" = "success" ]; then
            printf 'mode=skip\ntests=\nsatz=0\n' >> "$GITHUB_OUTPUT"
            msg="Tests übersprungen: Baum $tree schon geprüft im Lauf https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
            echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$PR" ] && [ -f scripts/select_tests.py ] \
             && gh api "$files" --paginate --jq '.[] | select(.status != "removed") | .filename' > /tmp/changed.txt \
             && gh api "$files" --paginate --jq '.[] | select(.status == "removed" or .status == "renamed") | (.previous_filename // .filename)' > /tmp/removed.txt; then
            python scripts/select_tests.py --files /tmp/changed.txt --removed /tmp/removed.txt --github-output "$GITHUB_OUTPUT"
          else
            printf 'mode=full\ntests=\nsatz=1\n' >> "$GITHUB_OUTPUT"
            echo "Alle Tests"
          fi

      - name: Branches holen
        # Serien (#116): Figuren und Bände stehen auf dem Standard-Branch
        run: git fetch -q --depth=1 origin '+refs/heads/*:refs/remotes/origin/*' || true

      - name: Buchprojekte prüfen
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          projects="."
          [ "${{ steps.kind.outputs.program }}" = "1" ] || { python scripts/validate_project.py .; exit 0; }
          for dir in tests/fixtures/*/; do
            [ -f "$dir/ghostwriter.yml" ] && projects="$projects ${dir%/}"
          done
          python scripts/validate_project.py $projects

      - name: Rollen im Buch prüfen (#455)
        # Nur in Büchern mit Team-Liste: Abschlüsse/Auflagen nur durch Freigabeberechtigte,
        # Team-Änderungen nur durch Eigentümer; maßgeblich ist das Team des Ausgangsstands.
        if: steps.kind.outputs.program != '1' && hashFiles('scripts/team.py') != ''
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Kein Ausgangsstand (neuer Branch): nichts zu prüfen"; exit 0
          fi
          git fetch -q --depth=1 origin "$BASE" || { echo "::warning::Ausgangsstand $BASE nicht abrufbar; Rollenprüfung übersprungen"; exit 0; }
          python scripts/team.py . gate --base "$BASE" --actor "$ACTOR"

      - name: Bibliothek prüfen (Kurztitel eindeutig)
        # Alle Branches holen; jedes Buch braucht einen eigenen Kurztitel (#36)
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [ -f scripts/library.py ] || exit 0
          git fetch -q --depth=1 origin '+refs/heads/*:refs/remotes/origin/*' || true
          python scripts/library.py list
          python scripts/library.py check

      - name: Programm-Repository ohne Buchinhalte
        # Nur im GhostWriter-Hauptrepository (#48): Fehler bei Kapiteln oder Auflagen auf
        # dem Standard-Branch, bei Buch-Branches und bei Auflagen-Tags
        if: github.ref_name == github.event.repository.default_branch
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          upstream=$(python -c "import yaml;print((yaml.safe_load(open('ghostwriter-manifest.yml')).get('upstream') or {}).get('repo',''))")
          [ "$upstream" = "$GITHUB_REPOSITORY" ] && [ -f scripts/library.py ] || exit 0
          git fetch -q --depth=1 --tags origin '+refs/heads/*:refs/remotes/origin/*' || true
          python scripts/library.py check-program

      - name: Übersichtsdatei prüfen
        # Nur Hinweis, kein Fehler: Die Action „Übersichtsdatei aktualisieren“
        # erzeugt die Datei nach demselben Push neu.
        run: |
          if [ -f ghostwriter-index.json ] && ! out=$(python scripts/build_index.py . --check); then
            echo "::warning file=ghostwriter-index.json::$out"
          else
            echo "Übersichtsdatei aktuell oder nicht nötig"
          fi

      - uses: actions/setup-node@v4
        if: steps.kind.outputs.program == '1'
        with:
          node-version: '22'

      - name: Satzpakete – Cache-Schlüssel
        # PDF-/EPUB-Tests brauchen pandoc, XeLaTeX und poppler-utils (wie proof/edition/omnibus), qpdf für die Vorderseite im PDF (#324);
        # ohne sie werden diese Tests übersprungen. Nur im Hauptrepository.
        if: steps.kind.outputs.program == '1' && steps.scope.outputs.satz == '1'
        id: tex
        env:
          PAKETE: >-
            pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-lang-german
            texlive-fonts-recommended fonts-texgyre lmodern poppler-utils qpdf
        run: |
          echo "pakete=$PAKETE" >> "$GITHUB_OUTPUT"
          echo "key=satz-${ImageOS:-ubuntu}-$(echo "$PAKETE" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Satzpakete – heruntergeladene Pakete aus dem Cache
        if: steps.kind.outputs.program == '1' && steps.scope.outputs.satz == '1'
        id: satz-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-satz
          key: ${{ steps.tex.outputs.key }}

      - name: Satzpakete installieren
        if: steps.kind.outputs.program == '1' && steps.scope.outputs.satz == '1'
        run: |
          start=$(date +%s)
          mkdir -p ~/apt-satz/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-satz" \
            ${{ steps.tex.outputs.pakete }} >/dev/null
          sudo rm -rf ~/apt-satz/partial ~/apt-satz/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-satz
          echo "Satzpakete in $(( $(date +%s) - start )) s, Cache $(du -sh ~/apt-satz | cut -f1)"
          pandoc --version | head -1; xelatex --version | head -1; pdftotext -v 2>&1 | head -1

      - name: Satzpakete – Cache sichern
        # Gleich nach der Installation, damit der Cache auch bei roten Tests entsteht
        if: steps.kind.outputs.program == '1' && steps.scope.outputs.satz == '1' && steps.satz-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-satz
          key: ${{ steps.tex.outputs.key }}

      - name: Tests (Kontextplanung, Zusammenführung)
        if: steps.kind.outputs.program == '1'
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          TESTS: ${{ steps.scope.outputs.tests }}
        run: |
          [ -d tests ] || exit 0
          if [ "$MODE" = "skip" ]; then
            echo "Keine Tests: derselbe Stand wurde schon im Pull Request vollständig geprüft (#485)."
          elif [ "$MODE" = "subset" ]; then
            echo "Nur die betroffenen Tests: $TESTS"
            python scripts/run_tests.py $TESTS
          else
            # parallel je Modul, am Ende die langsamsten Module (#485)
            python scripts/run_tests.py
          fi

      - name: Doku passt zum Programm
        # Aktionen und Platzhalter der Vorlagen (ghostwriter-ui im festen Commit),
        # Datenmodell, Läufe und Links (scripts/check_docs.py)
        run: |
          [ -f scripts/check_docs.py ] || exit 0
          repo=$(python -c "import yaml;print(yaml.safe_load(open('templates/ui/ghostwriter-ui.yml'))['repo'])")
          ref=$(python -c "import yaml;print(yaml.safe_load(open('templates/ui/ghostwriter-ui.yml'))['commit'])")
          git init -q /tmp/ui && git -C /tmp/ui fetch -q --depth 1 "https://github.com/$repo" "$ref" && git -C /tmp/ui checkout -q FETCH_HEAD
          ms=""
          if [ "$GITHUB_REPOSITORY" = "ploeffler/GhostWriter" ] && gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" > /tmp/milestones.json 2>/dev/null; then
            ms="--milestones /tmp/milestones.json"
          fi
          python scripts/check_docs.py --ui /tmp/ui $ms
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Dokumentationswebsite lokal aufbauen und prüfen (ohne Veröffentlichung)
        if: steps.kind.outputs.program == '1'
        run: python scripts/build_docs_site.py

      - name: Geprüften Stand vermerken
        # Nur nach einem grünen vollen Lauf im Pull Request (letzter Schritt): der Lauf auf dem
        # Standard-Branch erkennt daran den schon geprüften Baum (#485).
        if: steps.kind.outputs.program == '1' && github.event_name == 'pull_request' && steps.scope.outputs.mode == 'full'
        run: echo "${{ steps.scope.outputs.tree }}" > /tmp/validate-tree.txt
      - if: steps.kind.outputs.program == '1' && github.event_name == 'pull_request' && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: validate-full-${{ steps.scope.outputs.tree }}
          path: /tmp/validate-tree.txt
          retention-days: 7
