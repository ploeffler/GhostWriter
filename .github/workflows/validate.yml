name: Projektdateien prüfen

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: read      # Meilensteine für die Roadmap-Prüfung

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install pyyaml jsonschema requests pydantic pillow python-docx
          pip install -r scripts/docsite/requirements.txt

      - name: workflow.yml gegen sein Schema prüfen
        run: |
          python - <<'EOF'
          import json, yaml
          from jsonschema import Draft202012Validator
          schema = json.load(open('schemas/workflow.schema.json', encoding='utf-8'))
          data = yaml.safe_load(open('workflow.yml', encoding='utf-8'))
          errors = list(Draft202012Validator(schema).iter_errors(data))
          for e in errors:
              print(f"workflow.yml: {'/'.join(map(str, e.absolute_path))}: {e.message}")
          raise SystemExit(1 if errors else 0)
          EOF

      - name: Workflow-Semantik prüfen
        run: python scripts/check_workflow_consistency.py

      - name: Programm oder Buch?
        # Tests und Testbücher gehören zum Programm (tests/ wird nicht mit dem Update
        # verteilt); in Buch-Repositorys würden veraltete Kopien sonst fehlschlagen.
        id: kind
        run: |
          upstream=$(python -c "import yaml;print((yaml.safe_load(open('ghostwriter-manifest.yml')).get('upstream') or {}).get('repo',''))" 2>/dev/null || true)
          if [ "$upstream" = "$GITHUB_REPOSITORY" ] || [ ! -f ghostwriter-manifest.yml ]; then echo "program=1" >> "$GITHUB_OUTPUT"; fi

      - name: Branches holen
        # Serien (#116): Figuren und Bände stehen auf dem Standard-Branch
        run: git fetch -q --depth=1 origin '+refs/heads/*:refs/remotes/origin/*' || true

      - name: Buchprojekte prüfen
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          projects="."
          [ "${{ steps.kind.outputs.program }}" = "1" ] || { python scripts/validate_project.py .; exit 0; }
          for dir in tests/fixtures/*/; do
            [ -f "$dir/ghostwriter.yml" ] && projects="$projects ${dir%/}"
          done
          python scripts/validate_project.py $projects

      - name: Bibliothek prüfen (Kurztitel eindeutig)
        # Alle Branches holen; jedes Buch braucht einen eigenen Kurztitel (#36)
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [ -f scripts/library.py ] || exit 0
          git fetch -q --depth=1 origin '+refs/heads/*:refs/remotes/origin/*' || true
          python scripts/library.py list
          python scripts/library.py check

      - name: Programm-Repository ohne Buchinhalte
        # Nur im GhostWriter-Hauptrepository (#48): Fehler bei Kapiteln oder Auflagen auf
        # dem Standard-Branch, bei Buch-Branches und bei Auflagen-Tags
        if: github.ref_name == github.event.repository.default_branch
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          upstream=$(python -c "import yaml;print((yaml.safe_load(open('ghostwriter-manifest.yml')).get('upstream') or {}).get('repo',''))")
          [ "$upstream" = "$GITHUB_REPOSITORY" ] && [ -f scripts/library.py ] || exit 0
          git fetch -q --depth=1 --tags origin '+refs/heads/*:refs/remotes/origin/*' || true
          python scripts/library.py check-program

      - name: Übersichtsdatei prüfen
        # Nur Hinweis, kein Fehler: Die Action „Übersichtsdatei aktualisieren“
        # erzeugt die Datei nach demselben Push neu.
        run: |
          if [ -f ghostwriter-index.json ] && ! out=$(python scripts/build_index.py . --check); then
            echo "::warning file=ghostwriter-index.json::$out"
          else
            echo "Übersichtsdatei aktuell oder nicht nötig"
          fi

      - uses: actions/setup-node@v4
        if: steps.kind.outputs.program == '1'
        with:
          node-version: '22'

      - name: Satzpakete – Cache-Schlüssel
        # PDF-/EPUB-Tests brauchen pandoc, XeLaTeX und poppler-utils (wie proof/edition/omnibus);
        # ohne sie werden diese Tests übersprungen. Nur im Hauptrepository.
        if: steps.kind.outputs.program == '1'
        id: tex
        env:
          PAKETE: >-
            pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-lang-german
            texlive-fonts-recommended fonts-texgyre lmodern poppler-utils
        run: |
          echo "pakete=$PAKETE" >> "$GITHUB_OUTPUT"
          echo "key=satz-${ImageOS:-ubuntu}-$(echo "$PAKETE" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Satzpakete – heruntergeladene Pakete aus dem Cache
        if: steps.kind.outputs.program == '1'
        id: satz-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-satz
          key: ${{ steps.tex.outputs.key }}

      - name: Satzpakete installieren
        if: steps.kind.outputs.program == '1'
        run: |
          start=$(date +%s)
          mkdir -p ~/apt-satz/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-satz" \
            ${{ steps.tex.outputs.pakete }} >/dev/null
          sudo rm -rf ~/apt-satz/partial ~/apt-satz/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-satz
          echo "Satzpakete in $(( $(date +%s) - start )) s, Cache $(du -sh ~/apt-satz | cut -f1)"
          pandoc --version | head -1; xelatex --version | head -1; pdftotext -v 2>&1 | head -1

      - name: Satzpakete – Cache sichern
        # Gleich nach der Installation, damit der Cache auch bei roten Tests entsteht
        if: steps.kind.outputs.program == '1' && steps.satz-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-satz
          key: ${{ steps.tex.outputs.key }}

      - name: Tests (Kontextplanung, Zusammenführung)
        if: steps.kind.outputs.program == '1'
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -p "test_*.py"; fi

      - name: Doku passt zum Programm
        # Aktionen und Platzhalter der Vorlagen (ghostwriter-ui im festen Commit),
        # Datenmodell, Läufe und Links (scripts/check_docs.py)
        run: |
          [ -f scripts/check_docs.py ] || exit 0
          repo=$(python -c "import yaml;print(yaml.safe_load(open('templates/ui/ghostwriter-ui.yml'))['repo'])")
          ref=$(python -c "import yaml;print(yaml.safe_load(open('templates/ui/ghostwriter-ui.yml'))['commit'])")
          git init -q /tmp/ui && git -C /tmp/ui fetch -q --depth 1 "https://github.com/$repo" "$ref" && git -C /tmp/ui checkout -q FETCH_HEAD
          ms=""
          if [ "$GITHUB_REPOSITORY" = "ploeffler/GhostWriter" ] && gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" > /tmp/milestones.json 2>/dev/null; then
            ms="--milestones /tmp/milestones.json"
          fi
          python scripts/check_docs.py --ui /tmp/ui $ms
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Dokumentationswebsite lokal aufbauen und prüfen (ohne Veröffentlichung)
        if: steps.kind.outputs.program == '1'
        run: python scripts/build_docs_site.py
