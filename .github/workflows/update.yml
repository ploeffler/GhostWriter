name: GhostWriter aktualisieren

# Holt neue GhostWriter-Versionen aus dem Hauptrepository
# (ghostwriter-manifest.yml: upstream) und spielt sie automatisch in die
# Buch-Branches ein: nur Programmdateien, nie Buchinhalte; vorher Migrationen
# und Prüfung, bei Fehlern kein Update, sondern ein Issue. Siehe docs/UPDATES.md.
#
# Secret GHOSTWRITER_UPDATE_TOKEN (optional, Fine-grained Token):
#   - Leserecht (Contents: read) auf das Hauptrepository, wenn es privat ist
#   - Contents und Workflows: read/write auf dieses Repository, damit auch
#     Dateien unter .github/workflows/ aktualisiert werden können
# Ohne Secret werden Workflow-Dateien ausgelassen und das wird gemeldet.

on:
  schedule:
    - cron: '23 3 * * *'   # täglich 03:23 UTC
  workflow_dispatch:
    inputs:
      branch:
        description: 'Nur diesen Buch-Branch aktualisieren (leer = alle)'
        required: false
      dry_run:
        description: 'Probelauf: nur anzeigen, nichts einspielen'
        type: boolean
        default: false

      send_report:
        description: 'Vollständigen Tagesbericht als Issue-Kommentar zustellen (höchstens einmal pro UTC-Tag; nicht im Probelauf)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: ghostwriter-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GHOSTWRITER_UPDATE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install pyyaml jsonschema

      - name: Limits prüfen
        # #62: unter limits.pause_below_percent (Vorgabe 10 %) läuft die Automatik nicht; kein Fehlerlauf.
        # Ein von Hand gestarteter Lauf (workflow_dispatch) ist eine manuelle Aktion und läuft trotzdem.
        id: limits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f scripts/limits.py ] || { echo "paused=false" >> "$GITHUB_OUTPUT"; exit 0; }
          python scripts/limits.py . check --automation --live

      - name: Hinweis-Issue „GhostWriter-Automatik pausiert“
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PAUSED: ${{ steps.limits.outputs.paused }}
          TEXT: ${{ steps.limits.outputs.text }}
        run: |
          title="GhostWriter-Automatik pausiert"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "$PAUSED" = "true" ]; then
            body="$TEXT"$'\n\n'"Stand: $(date -u +%Y-%m-%dT%H:%MZ). Die tägliche Update-Prüfung ist ausgesetzt, bis wieder genug übrig ist (neuer Monat, höheres Budget oder Grenze in den Projekteinstellungen). Manuelle Läufe gehen weiter. Siehe docs/UPDATES.md."
            if [ -n "$num" ]; then gh issue edit "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Wieder genug übrig; die Automatik läuft wieder."
          fi

      - name: Updates einspielen
        id: apply
        if: steps.limits.outputs.paused != 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHOSTWRITER_UPDATE_TOKEN: ${{ secrets.GHOSTWRITER_UPDATE_TOKEN }}
          DAILY_UPDATE_REPORT_PATH: ${{ runner.temp }}/ghostwriter-update-report.md
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$INPUT_BRANCH" ]; then args+=(--branch "$INPUT_BRANCH"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/update_from_upstream.py "${args[@]}"

      - name: Tägliche GitHub-Übersicht ergänzen
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_UPDATE_REPORT_PATH: ${{ runner.temp }}/ghostwriter-update-report.md
          GHOSTWRITER_INTERFACE_LANGUAGE: ${{ vars.GHOSTWRITER_INTERFACE_LANGUAGE }}
          DAILY_REPORT_SEND: ${{ github.event_name == 'schedule' || (inputs.send_report && !inputs.dry_run) }}
          DAILY_REPORT_RECIPIENT: ${{ vars.GHOSTWRITER_REPORT_RECIPIENT || github.actor }}
          UPDATE_OUTCOME: ${{ steps.apply.outcome }}
          UPDATE_PAUSED: ${{ steps.limits.outputs.paused }}
          UPDATE_LIMIT_TEXT: ${{ steps.limits.outputs.text }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'; then
            export SUMMARY_BRANCHES_AVAILABLE=true
          else
            export SUMMARY_BRANCHES_AVAILABLE=false
          fi
          python scripts/daily_summary.py
