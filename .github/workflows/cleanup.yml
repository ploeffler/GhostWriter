name: Branches aufräumen

# Löscht erledigte Arbeits-Branches mit einem Klick (Actions → Branches aufräumen
# → Run workflow). Gelöscht wird nur ein Branch nach PATTERN, dessen Pull Request
# gemergt ist und der seitdem keinen neuen Commit hat, oder der vollständig im
# Standard-Branch enthalten ist (nichts geht verloren). Dazu gehören auch die
# Arbeits-Branches des Chats (ghostwriter/…) und media/, test/, codex/, claude/ (außer KEEP).
# Ein Branch mit offenem Pull Request
# oder eigenen, nicht übernommenen Commits bleibt immer. Mit „Nur anzeigen“ wird nichts gelöscht, nur aufgelistet.
# Versions-Branches (v0.1, v0.2 …) werden zu Tags gleichen Namens (annotiert,
# auf demselben Commit) und danach als Branch gelöscht; der Stand bleibt über
# den Tag erreichbar. Gibt es den Tag schon auf einem anderen Commit, bleibt
# der Branch. Die offenen Löschaufgaben stehen im Issue „Löschaufgaben“.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur anzeigen, nichts löschen'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versions-Branches zu Tags
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "## Versions-Branches zu Tags" >> "$GITHUB_STEP_SUMMARY"
          for b in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin | grep -E '^v[0-9]+\.[0-9]+$' || true); do
            sha=$(git rev-parse "refs/remotes/origin/$b")
            if git rev-parse -q --verify "refs/tags/$b" >/dev/null; then
              tagsha=$(git rev-parse "refs/tags/$b^{commit}")
              if [ "$tagsha" != "$sha" ]; then
                echo "- ⏸️ \`$b\` bleibt: Tag zeigt auf einen anderen Commit" >> "$GITHUB_STEP_SUMMARY"; continue
              fi
            elif [ "$DRY" != "true" ]; then
              git tag -a "$b" "$sha" -m "GhostWriter $b (Stand des früheren Branches $b)"
              git push -q origin "refs/tags/$b"
            fi
            if [ "$DRY" != "true" ]; then git push -q origin --delete "refs/heads/$b"; fi
            echo "- 🏷️ \`$b\` → Tag \`$b\` (${sha:0:7}), Branch gelöscht" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Erledigte Branches löschen
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          DRY: ${{ inputs.dry_run }}
          PATTERN: '^(feat|fix|docs|ui|chore|media|test|codex|claude|ghostwriter)/'
          KEEP: '^(test/test-book)$'   # bleiben immer, auch wenn sie dem Muster entsprechen
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          deleted=0; kept=0
          echo "## Branches aufräumen" >> "$GITHUB_STEP_SUMMARY"
          [ "$DRY" = "true" ] && echo "_Nur anzeigen – nichts gelöscht._" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for b in $(gh api "repos/$R/branches" --paginate --jq '.[].name' | grep -E "$PATTERN" | grep -vE "$KEEP" || true); do
            sha=$(gh api "repos/$R/branches/$b" --jq .commit.sha)
            pr=$(gh api "repos/$R/pulls?state=closed&head=$OWNER:$b&per_page=100" \
                 --jq "[.[] | select(.merged_at != null and .head.sha == \"$sha\")][0].number // empty")
            why="Pull Request #$pr gemergt"
            if [ -z "$pr" ]; then
              open=$(gh api "repos/$R/pulls?state=open&head=$OWNER:$b" --jq 'length')
              ahead=$(gh api "repos/$R/compare/$BASE...$b" --jq .ahead_by 2>/dev/null || echo 1)
              if [ "$open" = "0" ] && [ "$ahead" = "0" ]; then pr=x; why="vollständig in $BASE enthalten"; fi
            fi
            if [ -n "$pr" ]; then
              if [ "$DRY" != "true" ]; then gh api -X DELETE "repos/$R/git/refs/heads/$b" >/dev/null; fi
              echo "- 🗑️ \`$b\` ($why)" >> "$GITHUB_STEP_SUMMARY"; deleted=$((deleted+1))
            else
              echo "- ⏸️ \`$b\` bleibt (offener Pull Request oder eigene, nicht übernommene Commits)" >> "$GITHUB_STEP_SUMMARY"; kept=$((kept+1))
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gelöscht: $deleted · geblieben: $kept" | tee -a "$GITHUB_STEP_SUMMARY"
