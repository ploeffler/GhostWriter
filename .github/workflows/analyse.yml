name: Analyse im Hintergrund

# Liest ein ganzes Buch (oder ein Kapitel) mit einer KI über deren API und legt
# Vorschläge ab (#123, #124, scripts/analyze.py): Figuren, Kurzbeschreibungen
# und Ziele, Stilprofil, Schauplätze, Zeitleiste, Widersprüche, Sprache (ohne KI). Nichts am Buch wird geändert; übernommen wird im Chat. Nur
# geänderte Kapitel werden neu gelesen (Zwischenspeicher analysis/cache/).
# Hintergrund-Warteschlange (#479): Jeder Start legt einen Auftrag `jobs/request-NNN.yml` (type: analysis)
# auf dem Buch-Branch an (Job prep, nie verdrängt); Job process arbeitet die Analyse-Aufträge des Buchs der
# Reihe nach ab, in einer Gruppe je Buch mit Recherche, Colorieren und Import. Start ohne `kind` = nur
# abarbeiten. Start von Hand (Run workflow, auf dem Buch-Branch) oder aus dem Chat
# (START.md, „Analysen im Hintergrund“). Braucht das Secret ANTHROPIC_API_KEY bzw.
# OPENAI_API_KEY (nicht für „Sprache“: Rechtschreibung und Grammatik prüft ein im Runner
# gestarteter LanguageTool-Server, ohne KI und ohne Kosten, #280). Kosten kommen nach costs/project.yml (source: action_api)
# und zählen zum KI-Budget; unter 10 % Rest startet der Lauf nur mit
# confirm_low_budget (#62).

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Analyse: characters, summaries, style, places, glossary, timeline, continuity, language, chronology, portraits (mehrere mit Komma; leer = nur die Warteschlange abarbeiten)'
        default: ''
      scope:
        description: 'Bereich: book (ganzes Buch) oder Nummer eines Kapitels'
        default: book
      prompt_profile:
        description: 'Prompt-Profil erstellen (Metadaten im Laufprotokoll, keine Volltexte)'
        type: boolean
        default: false
      confirm_low_budget:
        description: 'Auch starten, wenn weniger als 10 % des KI-Budgets übrig sind'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # Selbstneustart

defaults:
  run:
    shell: bash

env:
  LIMIT: '3'

jobs:
  prep:
    # Auftrag sofort ablegen (#479): dieser Job hat keine Concurrency-Gruppe und kann daher nicht
    # durch einen späteren Start verdrängt werden. Liefert den Buchnamen für die Gruppe je Buch.
    runs-on: ubuntu-latest
    outputs:
      book: ${{ steps.book.outputs.book }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Abhängigkeiten
        run: pip install pyyaml jsonschema

      - name: Buch
        id: book
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          prefix=$(sed -n 's/^[[:space:]]*work_prefix:[[:space:]]*["'"'"']\{0,1\}\([^"'"'"' ]*\).*/\1/p' ghostwriter-manifest.yml | head -n1)
          prefix=${prefix:-ghostwriter/}
          book=${GITHUB_REF_NAME#"$prefix"}
          if [ "$book" = "$GHOSTWRITER_DEFAULT_BRANCH" ] && ! python scripts/library.py is "$book" --dir .; then
            echo "::error::$book ist kein Buch. Den Lauf auf dem Buch-Branch starten."; exit 1
          fi
          echo "book=$book" >> "$GITHUB_OUTPUT"

      - name: Auftrag anlegen
        if: inputs.kind != ''
        env:
          BOOK: ${{ steps.book.outputs.book }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          KIND: ${{ inputs.kind }}
          SCOPE: ${{ inputs.scope }}
          PROFILE: ${{ inputs.prompt_profile }}
          CONFIRM: ${{ inputs.confirm_low_budget }}
        run: |
          target="$BOOK"
          git config user.name GhostWriter
          git config user.email ghostwriter@users.noreply.github.com
          if git ls-remote --exit-code --heads origin "$target" >/dev/null; then
            git fetch -q origin "$target"; git switch -q -C target "origin/$target"
          else
            git fetch -q origin "$BOOK"; git switch -q -C target "origin/$BOOK"
          fi
          git fetch -q origin "$GITHUB_REF_NAME"
          git restore --source="origin/$GITHUB_REF_NAME" --worktree -- scripts
          args=(--type analysis --requested-by workflow_dispatch --push-to "$target")
          args+=(--field "kind=$KIND" --field "scope=${SCOPE:-book}")
          if [ "$PROFILE" = "true" ]; then args+=(--field prompt_profile=true); fi
          if [ "$CONFIRM" = "true" ]; then args+=(--confirm-low-budget); fi
          python scripts/jobs.py . enqueue "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  process:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ein Lauf je Buch über alle Arten der Hintergrund-Warteschlange (research, analysis, colorize, import, chapter_review)
    concurrency:
      group: jobs-${{ needs.prep.outputs.book }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Abhängigkeiten
        run: pip install pyyaml jsonschema

      - name: Ziel-Branch
        id: work
        env:
          BOOK: ${{ needs.prep.outputs.book }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! python scripts/library.py is "$BOOK" --dir .; then
            echo "::error::$BOOK ist kein Buch. Den Lauf auf dem Buch-Branch starten."; exit 1
          fi
          target="$BOOK"
          if git ls-remote --exit-code --heads origin "$target" >/dev/null; then
            git fetch -q origin "$target"; git switch -q -C target "origin/$target"
          else
            git fetch -q origin "$BOOK"; git switch -q -C target "origin/$BOOK"
          fi
          # Programm immer vom Buch-Branch (ein Arbeits-Branch kann älter sein)
          git fetch -q origin "$BOOK"
          git restore --source="origin/$BOOK" --worktree -- scripts
          git config user.name GhostWriter
          git config user.email ghostwriter@users.noreply.github.com
          echo "book=$BOOK" >> "$GITHUB_OUTPUT"
          echo "branch=$target" >> "$GITHUB_OUTPUT"

      - name: LanguageTool vorbereiten
        id: lt
        run: |
          # Nur wenn ein offener Auftrag die Art „language“ enthält (Sprachprüfung ohne KI, #280)
          if grep -rqs --include='request-*.yml' -e 'language' jobs/ 2>/dev/null; then echo "use=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        if: steps.lt.outputs.use == '1'
        with:
          distribution: temurin
          java-version: '17'

      - name: LanguageTool aus dem Zwischenspeicher
        if: steps.lt.outputs.use == '1'
        uses: actions/cache@v4
        with:
          path: ~/languagetool
          key: languagetool-6.6

      - name: LanguageTool starten
        if: steps.lt.outputs.use == '1'
        env:
          LT_VERSION: '6.6'
          LT_SHA256: 53600506b399bb5ffe1e4c8dec794fd378212f14aaf38ccef9b6f89314d11631
        run: |
          dir="$HOME/languagetool/LanguageTool-$LT_VERSION"
          if [ ! -f "$dir/languagetool-server.jar" ]; then
            mkdir -p "$HOME/languagetool"
            zip="$RUNNER_TEMP/lt.zip"
            curl -fsSL --retry 3 -o "$zip" "https://languagetool.org/download/LanguageTool-$LT_VERSION.zip" \
              || curl -fsSL --retry 3 -o "$zip" "https://languagetool.org/download/archive/LanguageTool-$LT_VERSION.zip"
            echo "$LT_SHA256  $zip" | sha256sum -c -
            unzip -q "$zip" -d "$HOME/languagetool"
          fi
          nohup java -Xmx2g -cp "$dir/languagetool-server.jar" org.languagetool.server.HTTPServer \
            --port 8081 > "$RUNNER_TEMP/languagetool.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs "http://localhost:8081/v2/languages" > /dev/null; then
              echo "LANGUAGETOOL_URL=http://localhost:8081" >> "$GITHUB_ENV"; echo "LanguageTool läuft"; exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/languagetool.log"
          echo "::error::LanguageTool ist nicht gestartet."; exit 1


      - name: Warteschlange abarbeiten (analysis, chapter_review)
        id: jobs
        env:
          WORK: ${{ steps.work.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/jobs.py . process --types analysis,chapter_review,agent --limit "$LIMIT" --push-to "$WORK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Selbstneustart
        # Pausierte Automatik (GHOSTWRITER_ACTIONS_PAUSED, #62): nicht selbst weiterlaufen; der Rest bleibt in der
        # Warteschlange, bis von Hand oder vom täglichen Update-Lauf nach der Pause neu angestoßen wird. #757: auch
        # nach einem Fehler in einem späteren Speicherschritt fortsetzen, aber nie nach Abbruch oder Fehler in jobs.
        if: ${{ !cancelled() && steps.jobs.outcome == 'success' && steps.jobs.outputs.remaining != '' && steps.jobs.outputs.remaining != '0' && vars.GHOSTWRITER_ACTIONS_PAUSED != 'true' }}
        env:
          BOOK: ${{ steps.work.outputs.book }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ohne Eingaben: der nächste Lauf arbeitet nur die Warteschlange ab (gleiche Gruppe, also danach).
          gh workflow run analyse.yml --ref "$BOOK" -R "$GITHUB_REPOSITORY"
          echo "Noch ${{ steps.jobs.outputs.remaining }} Aufträge offen: nächster Lauf gestartet." | tee -a "$GITHUB_STEP_SUMMARY"
