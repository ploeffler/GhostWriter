name: Analyse im Hintergrund

# Liest ein ganzes Buch (oder ein Kapitel) mit einer KI über deren API und legt
# Vorschläge ab (#123, #124, scripts/analyze.py): Figuren, Kurzbeschreibungen
# und Ziele, Stilprofil … Nichts am Buch wird geändert; übernommen wird im Chat. Nur
# geänderte Kapitel werden neu gelesen (Zwischenspeicher analysis/cache/).
# Start von Hand (Run workflow, auf dem Buch-Branch) oder aus dem Chat
# (START.md, „Analysen im Hintergrund“). Braucht das Secret ANTHROPIC_API_KEY bzw.
# OPENAI_API_KEY. Kosten kommen nach costs/project.yml (source: action_api)
# und zählen zum KI-Budget; unter 10 % Rest startet der Lauf nur mit
# confirm_low_budget (#62).

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Analyse: characters, summaries, style (mehrere mit Komma)'
        default: characters
      scope:
        description: 'Bereich: book (ganzes Buch) oder Nummer eines Kapitels'
        default: book
      confirm_low_budget:
        description: 'Auch starten, wenn weniger als 10 % des KI-Budgets übrig sind'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: analyse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Serie (#116): Figuren der Serie vom Standard-Branch

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Abhängigkeiten
        run: pip install pyyaml jsonschema

      - name: Nur Buch-Branches
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! python scripts/library.py is "$GITHUB_REF_NAME" --dir .; then
            echo "::error::$GITHUB_REF_NAME ist kein Buch. Den Lauf auf dem Buch-Branch starten."; exit 1
          fi

      - name: Umfang und Limits
        env:
          CONFIRM: ${{ inputs.confirm_low_budget }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/analyze.py . plan --kind "${{ inputs.kind }}" --scope "${{ inputs.scope }}" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! python scripts/limits.py . check; then
            if [ "$CONFIRM" != "true" ]; then
              echo "::error::Weniger als 10 % des KI-Budgets übrig. Mit confirm_low_budget trotzdem starten."; exit 1
            fi
          fi

      - name: Analysieren
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/analyze.py . run --kind "${{ inputs.kind }}" --scope "${{ inputs.scope }}"

      - name: Vorschläge ablegen
        # Nur Daten (analysis/, costs/project.yml), kein Buchtext: direkt auf den Buch-Branch
        run: |
          git config user.name GhostWriter
          git config user.email ghostwriter@users.noreply.github.com
          git add analysis
          if [ -f costs/project.yml ]; then git add costs/project.yml; fi
          if git diff --cached --quiet; then echo "Nichts abzulegen"; exit 0; fi
          msg=$(python - "${{ inputs.kind }}" <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import analyze
          parts = []
          for k in [x.strip() for x in sys.argv[1].split(',') if x.strip()]:
              h = analyze.latest('.', k) or {}
              parts.append(f'{analyze.KINDS[k]["label"]} {h.get("suggestions", 0)} ({h.get("id", "–")})')
          print('Analyse im Hintergrund: ' + ', '.join(parts))
          PY
          )
          git commit -q -m "$msg" -m "GhostWriter-Aktion: analysis.start"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
