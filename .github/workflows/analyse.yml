name: Analyse im Hintergrund

# Liest ein ganzes Buch (oder ein Kapitel) mit einer KI über deren API und legt
# Vorschläge ab (#123, #124, scripts/analyze.py): Figuren, Kurzbeschreibungen
# und Ziele, Stilprofil, Schauplätze, Zeitleiste, Widersprüche, Sprache (ohne KI). Nichts am Buch wird geändert; übernommen wird im Chat. Nur
# geänderte Kapitel werden neu gelesen (Zwischenspeicher analysis/cache/).
# Start von Hand (Run workflow, auf dem Buch-Branch) oder aus dem Chat
# (START.md, „Analysen im Hintergrund“). Braucht das Secret ANTHROPIC_API_KEY bzw.
# OPENAI_API_KEY (nicht für „Sprache“: Rechtschreibung und Grammatik prüft ein im Runner
# gestarteter LanguageTool-Server, ohne KI und ohne Kosten, #280). Kosten kommen nach costs/project.yml (source: action_api)
# und zählen zum KI-Budget; unter 10 % Rest startet der Lauf nur mit
# confirm_low_budget (#62).

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Analyse: characters, summaries, style, places, timeline, continuity, language (mehrere mit Komma)'
        default: characters
      scope:
        description: 'Bereich: book (ganzes Buch) oder Nummer eines Kapitels'
        default: book
      prompt_profile:
        description: 'Prompt-Profil erstellen (Metadaten im Laufprotokoll, keine Volltexte)'
        type: boolean
        default: false
      confirm_low_budget:
        description: 'Auch starten, wenn weniger als 10 % des KI-Budgets übrig sind'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: analyse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Serie (#116): Figuren der Serie vom Standard-Branch

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Abhängigkeiten
        run: pip install pyyaml jsonschema

      # Rechtschreibung und Grammatik für „Sprache“ (#280): LanguageTool 6.6 (letzte feste Version, Prüfsumme
      # geprüft) als lokaler Server; das Paket (~250 MB) bleibt im Zwischenspeicher der Actions.
      - name: LanguageTool vorbereiten
        id: lt
        if: contains(inputs.kind, 'language')
        run: echo "use=1" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.lt.outputs.use == '1'
        with:
          distribution: temurin
          java-version: '17'

      - name: LanguageTool aus dem Zwischenspeicher
        if: steps.lt.outputs.use == '1'
        uses: actions/cache@v4
        with:
          path: ~/languagetool
          key: languagetool-6.6

      - name: LanguageTool starten
        if: steps.lt.outputs.use == '1'
        env:
          LT_VERSION: '6.6'
          LT_SHA256: 53600506b399bb5ffe1e4c8dec794fd378212f14aaf38ccef9b6f89314d11631
        run: |
          dir="$HOME/languagetool/LanguageTool-$LT_VERSION"
          if [ ! -f "$dir/languagetool-server.jar" ]; then
            mkdir -p "$HOME/languagetool"
            zip="$RUNNER_TEMP/lt.zip"
            curl -fsSL --retry 3 -o "$zip" "https://languagetool.org/download/LanguageTool-$LT_VERSION.zip" \
              || curl -fsSL --retry 3 -o "$zip" "https://languagetool.org/download/archive/LanguageTool-$LT_VERSION.zip"
            echo "$LT_SHA256  $zip" | sha256sum -c -
            unzip -q "$zip" -d "$HOME/languagetool"
          fi
          nohup java -Xmx2g -cp "$dir/languagetool-server.jar" org.languagetool.server.HTTPServer \
            --port 8081 > "$RUNNER_TEMP/languagetool.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs "http://localhost:8081/v2/languages" > /dev/null; then
              echo "LANGUAGETOOL_URL=http://localhost:8081" >> "$GITHUB_ENV"; echo "LanguageTool läuft"; exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/languagetool.log"
          echo "::error::LanguageTool ist nicht gestartet."; exit 1

      - name: Nur Buch-Branches
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! python scripts/library.py is "$GITHUB_REF_NAME" --dir .; then
            echo "::error::$GITHUB_REF_NAME ist kein Buch. Den Lauf auf dem Buch-Branch starten."; exit 1
          fi

      - name: Umfang und Limits
        env:
          CONFIRM: ${{ inputs.confirm_low_budget }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/analyze.py . plan --kind "${{ inputs.kind }}" --scope "${{ inputs.scope }}" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! python scripts/limits.py . check; then
            if [ "$CONFIRM" != "true" ]; then
              echo "::error::Weniger als 10 % des KI-Budgets übrig. Mit confirm_low_budget trotzdem starten."; exit 1
            fi
          fi

      - name: Analysieren
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GHOSTWRITER_PROMPT_PROFILE: ${{ inputs.prompt_profile && '1' || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/analyze.py . run --kind "${{ inputs.kind }}" --scope "${{ inputs.scope }}"

      - name: Vorschläge ablegen
        # Nur Daten (analysis/, costs/project.yml), kein Buchtext: direkt auf den Buch-Branch
        run: |
          git config user.name GhostWriter
          git config user.email ghostwriter@users.noreply.github.com
          git add analysis
          if [ -f costs/project.yml ]; then git add costs/project.yml; fi
          if git diff --cached --quiet; then echo "Nichts abzulegen"; exit 0; fi
          msg=$(python - "${{ inputs.kind }}" <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import analyze
          parts = []
          for k in [x.strip() for x in sys.argv[1].split(',') if x.strip()]:
              h = analyze.latest('.', k) or {}
              parts.append(f'{analyze.KINDS[k]["label"]} {h.get("suggestions", 0)} ({h.get("id", "–")})')
          print('Analyse im Hintergrund: ' + ', '.join(parts))
          PY
          )
          git commit -q -m "$msg" -m "GhostWriter-Aktion: analysis.start"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
