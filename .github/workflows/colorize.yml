name: Bild colorieren

# Färbt ein Schwarz-Weiß-Foto über den eigenen Google-Gemini-Zugang ein und übernimmt
# davon nur die Farbe (#452, scripts/colorize.py): Helligkeit Pixel für Pixel aus
# aufbereitet.jpg, aus dem Farbvorschlag nur die Farbkanäle a/b. Gesperrt für Bilder
# mit Kindern oder Jugendlichen (Ausnahme nur ausdrücklich: minors_exception) und für
# Dokumente (bild.yml). Bekannte Farben gehen als Hinweis mit (hint). Braucht das Secret
# GEMINI_API_KEY. Hintergrund-Warteschlange (#479): Jeder Start legt einen Auftrag `jobs/request-NNN.yml`
# (type: colorize) auf dem Arbeits-Branch an (Job prep, nie verdrängt; zehn Fotos = zehn Aufträge); Job
# process arbeitet sie der Reihe nach ab, in einer Gruppe je Buch mit Recherche, Analyse und Import.
# Start ohne `folder` = nur abarbeiten. Start von Hand (Run workflow, auf dem Buch-Branch) oder aus dem
# Chat (START.md, „Bilder colorieren“). Ergebnis kommt als Commit auf den Arbeits-Branch
# ghostwriter/<buch-branch> mit Änderungspaket; übernommen wird nur nach Bestätigung.

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Bildordner im Buch, z. B. quellen/bilder/2026-11-21-ehepaar (mit aufbereitet.jpg und bild.yml); leer = nur die Warteschlange abarbeiten'
        default: ''
      consent:
        description: 'Die Abgebildeten bzw. die Familie sind einverstanden; das Bild geht an Google'
        type: boolean
        default: false
      model:
        description: 'Gemini-Bildmodell (leer = ai_providers.services.google.model, sonst gemini-2.5-flash-image)'
        default: ''
      replace:
        description: 'Vorhandenes coloriert.jpg ersetzen'
        type: boolean
        default: false
      hint:
        description: 'Bekannte Farben als Hinweis an das Modell, z. B. „Die Fahne ist rot-weiß-rot.“ (optional)'
        default: ''
      minors_exception:
        description: 'Ausnahme: Kinder oder Jugendliche abgebildet (minderjaehrige: true), Familie ausdrücklich einverstanden'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write   # Selbstneustart

defaults:
  run:
    shell: bash

env:
  LIMIT: '5'

jobs:
  prep:
    # Auftrag sofort ablegen (#479): dieser Job hat keine Concurrency-Gruppe und kann daher nicht
    # durch einen späteren Start verdrängt werden. Liefert den Buchnamen für die Gruppe je Buch.
    runs-on: ubuntu-latest
    outputs:
      book: ${{ steps.book.outputs.book }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Abhängigkeiten
        run: pip install pyyaml jsonschema

      - name: Buch
        id: book
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          prefix=$(sed -n 's/^[[:space:]]*work_prefix:[[:space:]]*["'"'"']\{0,1\}\([^"'"'"' ]*\).*/\1/p' ghostwriter-manifest.yml | head -n1)
          prefix=${prefix:-ghostwriter/}
          book=${GITHUB_REF_NAME#"$prefix"}
          if [ "$book" = "$GHOSTWRITER_DEFAULT_BRANCH" ] && ! python scripts/library.py is "$book" --dir .; then
            echo "::error::$book ist kein Buch. Den Lauf auf dem Buch-Branch starten."; exit 1
          fi
          echo "book=$book" >> "$GITHUB_OUTPUT"

      - name: Auftrag anlegen
        if: inputs.folder != ''
        env:
          BOOK: ${{ steps.book.outputs.book }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FOLDER: ${{ inputs.folder }}
          CONSENT: ${{ inputs.consent }}
          MODEL: ${{ inputs.model }}
          REPLACE: ${{ inputs.replace }}
          HINT: ${{ inputs.hint }}
          MINORS: ${{ inputs.minors_exception }}
        run: |
          target=$(python -c "import sys; sys.path.insert(0, 'scripts'); import library; print(library.work_branch(sys.argv[1]))" "$BOOK")
          git config user.name GhostWriter
          git config user.email ghostwriter@users.noreply.github.com
          if git ls-remote --exit-code --heads origin "$target" >/dev/null; then
            git fetch -q origin "$target"; git switch -q -C target "origin/$target"
          else
            git fetch -q origin "$BOOK"; git switch -q -C target "origin/$BOOK"
          fi
          git fetch -q origin "$BOOK"
          git restore --source="origin/$BOOK" --worktree -- scripts
          args=(--type colorize --requested-by workflow_dispatch --push-to "$target")
          args+=(--field "folder=$FOLDER" --field "consent=$CONSENT" --field "replace=$REPLACE" --field "minors_exception=$MINORS")
          if [ -n "$MODEL" ]; then args+=(--field "model=$MODEL"); fi
          if [ -n "$HINT" ]; then args+=(--field "hint=$HINT"); fi
          python scripts/jobs.py . enqueue "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  process:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ein Lauf je Buch über alle Arten der Hintergrund-Warteschlange (research, analysis, colorize, import)
    concurrency:
      group: jobs-${{ needs.prep.outputs.book }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten
        run: |
          pip install pyyaml jsonschema pillow numpy

      - name: Ziel-Branch
        id: work
        env:
          BOOK: ${{ needs.prep.outputs.book }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! python scripts/library.py is "$BOOK" --dir .; then
            echo "::error::$BOOK ist kein Buch. Den Lauf auf dem Buch-Branch starten."; exit 1
          fi
          target=$(python -c "import sys; sys.path.insert(0, 'scripts'); import library; print(library.work_branch(sys.argv[1]))" "$BOOK")
          if git ls-remote --exit-code --heads origin "$target" >/dev/null; then
            git fetch -q origin "$target"; git switch -q -C target "origin/$target"
          else
            git fetch -q origin "$BOOK"; git switch -q -C target "origin/$BOOK"
          fi
          # Programm immer vom Buch-Branch (ein Arbeits-Branch kann älter sein)
          git fetch -q origin "$BOOK"
          git restore --source="origin/$BOOK" --worktree -- scripts
          git config user.name GhostWriter
          git config user.email ghostwriter@users.noreply.github.com
          echo "book=$BOOK" >> "$GITHUB_OUTPUT"
          echo "branch=$target" >> "$GITHUB_OUTPUT"

      - name: Warteschlange abarbeiten (colorize)
        id: jobs
        env:
          WORK: ${{ steps.work.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/jobs.py . process --types colorize --limit "$LIMIT" --push-to "$WORK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Änderungspaket
        env:
          BOOK: ${{ steps.work.outputs.book }}
          WORK: ${{ steps.work.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --heads origin "$WORK" >/dev/null; then echo "Nichts zu speichern"; exit 0; fi
          owner=${GITHUB_REPOSITORY%%/*}
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$WORK&base=$BOOK" --jq 'length')
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BOOK...$WORK" --jq '.ahead_by')
          if [ "$open" = "0" ] && [ "${ahead:-0}" != "0" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls" -f base="$BOOK" -f head="$WORK" \
              -f title="GhostWriter: offene Änderungen" \
              -f body="Offene Änderungen aus GhostWriter. Übernommen wird erst nach Bestätigung." --jq '.html_url' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Änderungspaket: $WORK" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Selbstneustart
        if: steps.jobs.outputs.remaining != '' && steps.jobs.outputs.remaining != '0'
        env:
          BOOK: ${{ steps.work.outputs.book }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ohne Eingaben: der nächste Lauf arbeitet nur die Warteschlange ab (gleiche Gruppe, also danach).
          gh workflow run colorize.yml --ref "$BOOK" -R "$GITHUB_REPOSITORY"
          echo "Noch ${{ steps.jobs.outputs.remaining }} Aufträge offen: nächster Lauf gestartet." | tee -a "$GITHUB_STEP_SUMMARY"
