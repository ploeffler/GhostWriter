name: Manuskript importieren

# Manuskript als Buch übernehmen (#124, scripts/import_book.py), Teil ohne KI:
#   convert  Original (schon unter import/original/ im Buch-Branch) umwandeln und
#            die Gliederung als Vorschlag ablegen (import/proposal.json)
#   edit     Änderungen am Vorschlag (ops als JSON), auch: KI-Vorschlag übernehmen
#   outline  nur ohne Gliederung: KI-Vorschlag für Kapitel und Abschnitte
#            (import/outline.json; Anfänge ohne KI gegen den Text geprüft);
#            braucht ANTHROPIC_API_KEY bzw. OPENAI_API_KEY, Kosten nach
#            costs/project.yml; unter 10 % Budget nur mit confirm_low_budget
#   apply    Kapitel, Abschnitte und Teile anlegen (Status revision; Schreibfreigabe
#            nur mit writing_approval, festgehalten in approvals.yml)
# Hintergrund-Warteschlange (#479): Jeder Start legt einen Auftrag `jobs/request-NNN.yml` (type: import)
# auf dem Buch-Branch an (Job prep, nie verdrängt); Job process arbeitet die Schritte in Auftragsreihenfolge
# ab, in einer Gruppe je Buch mit Recherche, Analyse und Colorieren. Schritt `queue` = nur abarbeiten.
# Gestartet aus dem Chat (START.md, „Manuskript importieren“) auf dem Buch-Branch.
# Originale bleiben bis zu einem ausdrücklichen Löschauftrag erhalten (D21).

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Schritt'
        type: choice
        options: [convert, edit, outline, apply, queue]
        default: convert
      file:
        description: 'bei convert: Pfad des Originals im Repository (import/original/…)'
        default: ''
      keep:
        description: 'veraltet, ohne Wirkung (D21): das Original bleibt bis zum ausdrücklichen Löschauftrag'
        default: ''
      ops:
        description: 'bei edit: Änderungen als JSON-Liste'
        default: '[]'
      writing_approval:
        description: 'bei apply: Schreibfreigabe für alle importierten Abschnitte erteilen'
        type: boolean
        default: false
      by:
        description: 'bei apply mit Schreibfreigabe: GitHub-Login'
        default: ''
      prompt_profile:
        description: 'Prompt-Profil erstellen (Metadaten im Laufprotokoll, keine Volltexte)'
        type: boolean
        default: false
      confirm_low_budget:
        description: 'bei outline: auch starten, wenn weniger als 10 % des KI-Budgets übrig sind'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write   # Selbstneustart

defaults:
  run:
    shell: bash

env:
  LIMIT: '5'

jobs:
  prep:
    # Auftrag sofort ablegen (#479): dieser Job hat keine Concurrency-Gruppe und kann daher nicht
    # durch einen späteren Start verdrängt werden. Liefert den Buchnamen für die Gruppe je Buch.
    runs-on: ubuntu-latest
    outputs:
      book: ${{ steps.book.outputs.book }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Abhängigkeiten
        run: pip install pyyaml jsonschema

      - name: Buch
        id: book
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          prefix=$(sed -n 's/^[[:space:]]*work_prefix:[[:space:]]*["'"'"']\{0,1\}\([^"'"'"' ]*\).*/\1/p' ghostwriter-manifest.yml | head -n1)
          prefix=${prefix:-ghostwriter/}
          book=${GITHUB_REF_NAME#"$prefix"}
          if [ "$book" = "$GHOSTWRITER_DEFAULT_BRANCH" ] && ! python scripts/library.py is "$book" --dir .; then
            echo "::error::$book ist kein Buch. Den Lauf auf dem Buch-Branch starten."; exit 1
          fi
          echo "book=$book" >> "$GITHUB_OUTPUT"

      - name: Auftrag anlegen
        if: inputs.step != 'queue' && inputs.step != ''
        env:
          BOOK: ${{ steps.book.outputs.book }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STEP: ${{ inputs.step }}
          FILE: ${{ inputs.file }}
          OPS: ${{ inputs.ops }}
          WA: ${{ inputs.writing_approval }}
          BY: ${{ inputs.by }}
          PROFILE: ${{ inputs.prompt_profile }}
          CONFIRM: ${{ inputs.confirm_low_budget }}
        run: |
          target="$BOOK"
          git config user.name GhostWriter
          git config user.email ghostwriter@users.noreply.github.com
          if git ls-remote --exit-code --heads origin "$target" >/dev/null; then
            git fetch -q origin "$target"; git switch -q -C target "origin/$target"
          else
            git fetch -q origin "$BOOK"; git switch -q -C target "origin/$BOOK"
          fi
          git fetch -q origin "$BOOK"
          git restore --source="origin/$BOOK" --worktree -- scripts
          args=(--type import --requested-by workflow_dispatch --push-to "$target")
          if [ "$BOOK" = "$GHOSTWRITER_DEFAULT_BRANCH" ]; then
            echo "::error::$BOOK ist kein Buch-Branch. Zuerst „Neues Buch“, dann den Import auf dessen Branch starten."; exit 1
          fi
          args+=(--field "step=$STEP" --field "writing_approval=$WA" --field "prompt_profile=$PROFILE")
          if [ -n "$FILE" ]; then args+=(--field "file=$FILE"); fi
          if [ -n "$OPS" ] && [ "$OPS" != "[]" ]; then args+=(--field "ops=$OPS"); fi
          if [ -n "$BY" ]; then args+=(--field "by=$BY"); fi
          if [ "$CONFIRM" = "true" ]; then args+=(--confirm-low-budget); fi
          python scripts/jobs.py . enqueue "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  process:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ein Lauf je Buch über alle Arten der Hintergrund-Warteschlange (research, analysis, colorize, import)
    concurrency:
      group: jobs-${{ needs.prep.outputs.book }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten
        run: |
          pip install pyyaml jsonschema
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pandoc poppler-utils >/dev/null

      - name: Ziel-Branch
        id: work
        env:
          BOOK: ${{ needs.prep.outputs.book }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! python scripts/library.py is "$BOOK" --dir .; then
            echo "::error::$BOOK ist kein Buch. Den Lauf auf dem Buch-Branch starten."; exit 1
          fi
          target="$BOOK"
          if git ls-remote --exit-code --heads origin "$target" >/dev/null; then
            git fetch -q origin "$target"; git switch -q -C target "origin/$target"
          else
            git fetch -q origin "$BOOK"; git switch -q -C target "origin/$BOOK"
          fi
          # Programm immer vom Buch-Branch (ein Arbeits-Branch kann älter sein)
          git fetch -q origin "$BOOK"
          git restore --source="origin/$BOOK" --worktree -- scripts
          git config user.name GhostWriter
          git config user.email ghostwriter@users.noreply.github.com
          echo "book=$BOOK" >> "$GITHUB_OUTPUT"
          echo "branch=$target" >> "$GITHUB_OUTPUT"

      - name: Warteschlange abarbeiten (import)
        id: jobs
        env:
          WORK: ${{ steps.work.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/jobs.py . process --types import --limit "$LIMIT" --push-to "$WORK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Selbstneustart
        if: steps.jobs.outputs.remaining != '' && steps.jobs.outputs.remaining != '0'
        env:
          BOOK: ${{ steps.work.outputs.book }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ohne Eingaben: der nächste Lauf arbeitet nur die Warteschlange ab (gleiche Gruppe, also danach).
          gh workflow run import.yml --ref "$BOOK" -R "$GITHUB_REPOSITORY" -f step=queue
          echo "Noch ${{ steps.jobs.outputs.remaining }} Aufträge offen: nächster Lauf gestartet." | tee -a "$GITHUB_STEP_SUMMARY"
