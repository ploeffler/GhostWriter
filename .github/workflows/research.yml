name: Recherche

# Recherche mit Internet über den eingestellten Recherche-Anbieter (#462, scripts/research.py):
# Anbieter aus ai_providers.research.provider des Buchs (sonst erster passender Dienst aus
# available, sonst Einstellungen des Standard-Branchs), Schlüssel aus dem Secret, das in
# ai_providers.services.<id>.api_key_secret steht (Werte gelangen nie in Ausgaben).
# Start von Hand (Run workflow, auf dem Buch-Branch), aus dem Chat oder über einen Auftrag
# <kapitel>/research/<abschnitt>/request-NNN.yml, den die Claude-Web-App auf den
# Arbeits-Branch legt. Ergebnis: Rechercheeintrag mit Quellen aus den Suchbelegen und ein
# Kosteneintrag als Commit auf ghostwriter/<buch-branch> mit Änderungspaket; übernommen wird
# nur nach Bestätigung.

on:
  workflow_dispatch:
    inputs:
      section:
        description: 'Abschnitts-ID, z. B. sec-01-02-ankunft'
        required: true
      question:
        description: 'Fragestellung (leer = aus Ziel und Kurzbeschreibung des Abschnitts)'
        default: ''
      provider:
        description: 'Anbieter: anthropic, openai, google (leer = Einstellung für Recherche)'
        default: ''
      model:
        description: 'Modell (leer = Einstellung bzw. Vorgabe des Anbieters)'
        default: ''
      confirm_low_budget:
        description: 'Auch starten, wenn weniger als 10 % des KI-Budgets übrig sind'
        type: boolean
        default: false
  # Nur Aufträge aus der Claude-Web-App; andere Pushes auf Arbeits-Branches starten keinen Lauf (#287).
  push:
    branches: ['ghostwriter/**']
    paths: ['chapters/*/research/*/request-*.yml']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Abhängigkeiten
        run: pip install pyyaml jsonschema

      - name: Buch und Arbeits-Branch
        id: work
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            book=$(python -c "import sys; sys.path.insert(0, 'scripts'); import library; p = library.settings(library.load_manifest())['work_prefix']; b = sys.argv[1]; print(b[len(p):] if b.startswith(p) else '')" "$GITHUB_REF_NAME")
            work="$GITHUB_REF_NAME"
          else
            book="$GITHUB_REF_NAME"
            work=$(python -c "import sys; sys.path.insert(0, 'scripts'); import library; print(library.work_branch(sys.argv[1]))" "$book")
            # Offene Änderungen liegen im Arbeits-Branch: von dort weiterarbeiten.
            if git ls-remote --exit-code --heads origin "$work" >/dev/null; then
              git fetch -q origin "$work"
              git switch -q -c work "origin/$work"
            else
              git switch -q -c work
            fi
          fi
          if [ -z "$book" ] || ! python scripts/library.py is "$book" --dir .; then
            echo "::error::${book:-$GITHUB_REF_NAME} ist kein Buch. Den Lauf auf dem Buch-Branch starten."; exit 1
          fi
          # Programm immer vom Buch-Branch: der Arbeits-Branch kann vor dem letzten Update entstanden sein.
          git fetch -q origin "$book"
          git restore --source="origin/$book" --worktree -- scripts providers.yml
          echo "book=$book" >> "$GITHUB_OUTPUT"
          echo "branch=$work" >> "$GITHUB_OUTPUT"
          defaults="$RUNNER_TEMP/defaults.yml"
          if [ -n "$GHOSTWRITER_DEFAULT_BRANCH" ] && git show "origin/$GHOSTWRITER_DEFAULT_BRANCH:ghostwriter.yml" > "$defaults" 2>/dev/null; then
            echo "defaults=$defaults" >> "$GITHUB_OUTPUT"
          fi

      - name: Anbieter
        id: provider
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          DEFAULTS: ${{ steps.work.outputs.defaults }}
        run: |
          args=()
          if [ -n "$PROVIDER" ]; then args+=(--provider "$PROVIDER"); fi
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          if [ -n "$DEFAULTS" ]; then args+=(--defaults "$DEFAULTS"); fi
          if ! python scripts/research.py . provider "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"; then
            if [ "${{ github.event_name }}" = "push" ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else exit 1; fi
          fi

      - name: Budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python scripts/limits.py . check; then echo "low=false" >> "$GITHUB_OUTPUT"; else echo "low=true" >> "$GITHUB_OUTPUT"; fi

      - name: Recherchieren
        env:
          SECTION: ${{ inputs.section }}
          QUESTION: ${{ inputs.question }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          CONFIRM: ${{ inputs.confirm_low_budget }}
          LOW: ${{ steps.budget.outputs.low }}
          DEFAULTS: ${{ steps.work.outputs.defaults }}
          # Secret-Name aus den Einstellungen (nur Namen wie GEMINI_API_KEY, research.py prüft das)
          GHOSTWRITER_RESEARCH_KEY: ${{ steps.provider.outputs.secret && secrets[steps.provider.outputs.secret] || '' }}
        run: |
          args=()
          if [ -n "$DEFAULTS" ]; then args+=(--defaults "$DEFAULTS"); fi
          if [ "$LOW" = "true" ]; then args+=(--budget-low); fi
          if [ "${{ github.event_name }}" = "push" ]; then
            # Fehler stehen danach im Auftrag (error), die App zeigt sie an; der Commit folgt trotzdem.
            python scripts/research.py . process "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            args+=(--section "$SECTION")
            if [ -n "$QUESTION" ]; then args+=(--question "$QUESTION"); fi
            if [ -n "$PROVIDER" ]; then args+=(--provider "$PROVIDER"); fi
            if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
            if [ "$CONFIRM" = "true" ]; then args+=(--confirm-low-budget); fi
            python scripts/research.py . run "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Änderungspaket
        env:
          BOOK: ${{ steps.work.outputs.book }}
          WORK: ${{ steps.work.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name GhostWriter
          git config user.email ghostwriter@users.noreply.github.com
          git restore --source=HEAD --staged --worktree -- scripts providers.yml
          for d in chapters matter; do if [ -d "$d" ]; then git add -A -- "$d"; fi; done
          if git diff --cached --quiet; then echo "Nichts zu speichern"; exit 0; fi
          git commit -q -m "Recherche mit Internet" -m "GhostWriter-Aktion: research.web"
          # Die App kann inzwischen weiter gespeichert haben: bis zu drei Versuche mit Rebase.
          for i in 1 2 3; do
            if git push -q origin "HEAD:refs/heads/$WORK"; then pushed=1; break; fi
            git fetch -q origin "$WORK" && git rebase -q "origin/$WORK" || { git rebase --abort; break; }
          done
          if [ -z "${pushed:-}" ]; then echo "::error::Ergebnis konnte nicht auf $WORK gespeichert werden."; exit 1; fi
          owner=${GITHUB_REPOSITORY%%/*}
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$WORK&base=$BOOK" --jq 'length')
          if [ "$open" = "0" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls" -f base="$BOOK" -f head="$WORK" \
              -f title="GhostWriter: offene Änderungen" \
              -f body="Offene Änderungen aus GhostWriter. Übernommen wird erst nach Bestätigung." --jq '.html_url' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Änderungspaket aktualisiert: $WORK" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
