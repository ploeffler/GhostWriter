name: Bücherregal aktualisieren

# Schreibt library.json auf den Standard-Branch (scripts/library.py build, #37):
# je Buch Titel, Status, Fortschritt, Auflage, Kosten, offene Änderungen. Kein
# Manuskripttext. Läuft nach Pushes auf Buch- und Arbeits-Branches, wenn ein
# Branch gelöscht wird (ein neuer kommt mit einem Push), nach jedem Lauf „GhostWriter aktualisieren“
# (damit u. a. neu hinterlegte Secrets auf der Seite „Daten“ erscheinen, #71) und
# von Hand. Jeder relevante Push aktualisiert damit auch den Pending-Zähler im Bücherregal.
# Offene Sitzungssicherungen (#237): Pushes auf conversations/** und Öffnen bzw.
# Schließen eines Pull Requests aktualisieren die Rubrik; den PR-Status liest der Lauf
# über die REST-API (nur lesend), ohne ihn zeigt das Regal „Status nicht verfügbar“.
# Commits mit GITHUB_TOKEN
# lösen keine weiteren Workflows aus, es gibt also keine Schleife.
# Pull Requests aus Forks und von Bots (Dependabot) lösen keinen Lauf aus (#277).
#
# Im GhostWriter-Hauptrepository läuft sie nicht: library.json würde sonst mit
# jedem Update in fremde Bibliotheken wandern.

on:
  push:
    branches-ignore: ['v*', 'dependabot/**']
    paths:
      - 'README.md'
      - 'ghostwriter.yml'
      - 'assistant.yml'
      - 'chapters/**'
      - 'research/**'
      - 'brainstorming/**'
      - 'matter/**'
      - 'costs/**'
      - 'approvals.yml'
      - 'characters/**'
      - 'story/**'
      - 'cover/**'
      - 'reference-images/**'
      - 'analysis/**'
      - 'prompts/**'
      - 'series/**'
      - 'conversations/**'
  pull_request:
    types: [opened, reopened, closed]
  # Kein „create“: Ein neuer Branch kommt mit einem Push, der den Lauf ohnehin auslöst (#277).
  delete:
  workflow_run:
    workflows: ['GhostWriter aktualisieren']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read     # Läufe des Monats für die Minutenprüfung (#277)
  issues: write     # Hinweis-Issue „GhostWriter: Actions-Minuten knapp“

concurrency:
  group: library
  cancel-in-progress: true

jobs:
  library:
    # Pausiert (GHOSTWRITER_ACTIONS_PAUSED, #62): nur noch nach dem täglichen Update und von Hand;
    # dieser Lauf prüft die Minuten und hebt die Pause im neuen Monat wieder auf.
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (vars.GHOSTWRITER_ACTIONS_PAUSED != 'true'
          || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install pyyaml

      - name: Hauptrepository auslassen
        id: gate
        run: |
          upstream=$(python -c "import yaml;print((yaml.safe_load(open('ghostwriter-manifest.yml')).get('upstream') or {}).get('repo',''))")
          if [ "$upstream" = "$GITHUB_REPOSITORY" ] || [ ! -f scripts/library.py ]; then
            echo "Hauptrepository oder ältere Version: kein Bücherregal"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: library.json erzeugen
        if: steps.gate.outputs.skip != '1'
        # SECRETS_PRESENT: je bekanntem Namen nur, ob das Secret hinterlegt ist (true/false;
        # Seite „Daten“, #71); Werte gelangen nie in den Lauf. Nicht toJSON(secrets): Das lässt
        # GitHub Läufe in öffentlichen Repositorys anhalten. Block: scripts/secret_check.py block
        env:
          GHOSTWRITER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SECRETS_PRESENT: >-
            {"ANTHROPIC_API_KEY": ${{ secrets.ANTHROPIC_API_KEY != '' }},
             "AWS_BEDROCK_API_KEY": ${{ secrets.AWS_BEDROCK_API_KEY != '' }},
             "AZURE_AI_FOUNDRY_API_KEY": ${{ secrets.AZURE_AI_FOUNDRY_API_KEY != '' }},
             "BRAVE_API_KEY": ${{ secrets.BRAVE_API_KEY != '' }},
             "CLAUDE_CODE_OAUTH_TOKEN": ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }},
             "COHERE_API_KEY": ${{ secrets.COHERE_API_KEY != '' }},
             "DASHSCOPE_API_KEY": ${{ secrets.DASHSCOPE_API_KEY != '' }},
             "DEEPSEEK_API_KEY": ${{ secrets.DEEPSEEK_API_KEY != '' }},
             "EXA_API_KEY": ${{ secrets.EXA_API_KEY != '' }},
             "GEMINI_API_KEY": ${{ secrets.GEMINI_API_KEY != '' }},
             "GHOSTWRITER_UPDATE_TOKEN": ${{ secrets.GHOSTWRITER_UPDATE_TOKEN != '' }},
             "GITHUB_COPILOT_AGENT_API_KEY": ${{ secrets.GITHUB_COPILOT_AGENT_API_KEY != '' }},
             "GOOGLE_JULES_API_KEY": ${{ secrets.GOOGLE_JULES_API_KEY != '' }},
             "GOOGLE_VERTEX_API_KEY": ${{ secrets.GOOGLE_VERTEX_API_KEY != '' }},
             "LOCAL_LMSTUDIO_API_KEY": ${{ secrets.LOCAL_LMSTUDIO_API_KEY != '' }},
             "LOCAL_OLLAMA_API_KEY": ${{ secrets.LOCAL_OLLAMA_API_KEY != '' }},
             "MANUAL_API_KEY": ${{ secrets.MANUAL_API_KEY != '' }},
             "META_LLAMA_API_KEY": ${{ secrets.META_LLAMA_API_KEY != '' }},
             "MICROSOFT_COPILOT_API_KEY": ${{ secrets.MICROSOFT_COPILOT_API_KEY != '' }},
             "MISTRAL_API_KEY": ${{ secrets.MISTRAL_API_KEY != '' }},
             "MOONSHOT_API_KEY": ${{ secrets.MOONSHOT_API_KEY != '' }},
             "OPENAI_API_KEY": ${{ secrets.OPENAI_API_KEY != '' }},
             "OPENALEX_API_KEY": ${{ secrets.OPENALEX_API_KEY != '' }},
             "OPENROUTER_API_KEY": ${{ secrets.OPENROUTER_API_KEY != '' }},
             "PARALLEL_API_KEY": ${{ secrets.PARALLEL_API_KEY != '' }},
             "PERPLEXITY_API_KEY": ${{ secrets.PERPLEXITY_API_KEY != '' }},
             "SEMANTIC_SCHOLAR_API_KEY": ${{ secrets.SEMANTIC_SCHOLAR_API_KEY != '' }},
             "SERPAPI_API_KEY": ${{ secrets.SERPAPI_API_KEY != '' }},
             "TAVILY_API_KEY": ${{ secrets.TAVILY_API_KEY != '' }},
             "XAI_API_KEY": ${{ secrets.XAI_API_KEY != '' }}}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*'
          python scripts/library.py list
          pulls="$RUNNER_TEMP/pulls.json"
          if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" > "$pulls.raw" 2>/dev/null \
             && python -c "import json,sys;json.dump([p for page in json.load(open(sys.argv[1])) for p in page],open(sys.argv[2],'w'))" "$pulls.raw" "$pulls"; then
            python scripts/library.py build --out library.json --pulls "$pulls"
          else
            echo "::warning::Status der Sitzungs-PRs nicht lesbar; Bücherregal zeigt „Status nicht verfügbar“"
            python scripts/library.py build --out library.json
          fi

      - name: Bei Änderungen committen
        if: steps.gate.outputs.skip != '1'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add library.json
          if git diff --cached --quiet; then
            echo "Bücherregal unverändert"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bücherregal aktualisiert" -m "GhostWriter-Aktion: library.build"
          if ! git pull --rebase origin "$BRANCH"; then
            git rebase --abort
            echo "::warning::Bücherregal nicht gepusht, ein neuerer Lauf erzeugt es neu"
            exit 0
          fi
          git push origin "HEAD:$BRANCH"

      - name: Actions-Minuten prüfen
        # #277: nach jedem Regal-Lauf, nicht nur einmal am Tag. Private Repositorys ohne eigene
        # Angabe: 2000 Minuten; Vorwarnung unter 20 % bzw. 300 Restminuten, Pause unter 10 % bzw. 100.
        if: steps.gate.outputs.skip != '1'
        id: minutes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSTWRITER_REPO_PRIVATE: ${{ github.event.repository.private }}
        run: python scripts/limits.py . check --automation --live

      - name: Automatik anhalten bzw. fortsetzen
        # #62: In der Pausenstufe der Actions-Minuten setzt der Lauf GHOSTWRITER_ACTIONS_PAUSED,
        # sonst löscht er sie. Braucht GHOSTWRITER_UPDATE_TOKEN mit Variablen-Recht.
        if: >-
          steps.gate.outputs.skip != '1' && steps.minutes.outcome == 'success'
          && steps.minutes.outputs.minutes_state != 'unknown'
        id: pause
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHOSTWRITER_UPDATE_TOKEN || github.token }}
        run: python scripts/limits.py . pause-flag --paused ${{ steps.minutes.outputs.minutes_state == 'pause' }}

      - name: "Hinweis-Issue „GhostWriter: Actions-Minuten knapp“"
        if: steps.gate.outputs.skip != '1' && steps.minutes.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.minutes.outputs.minutes_state }}
          TEXT: ${{ steps.minutes.outputs.minutes_text }}
          FLAG: ${{ steps.pause.outputs.flag }}
          PAUSED_VAR: ${{ vars.GHOSTWRITER_ACTIONS_PAUSED }}
        run: |
          title="GhostWriter: Actions-Minuten knapp"
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "$STATE" = "warn" ] || [ "$STATE" = "pause" ]; then
            if [ "$STATE" = "pause" ]; then
              if [ "$FLAG" = "no_permission" ] && [ "$PAUSED_VAR" != "true" ]; then
                folge="Die tägliche Update-Prüfung ist ausgesetzt. Prüfung, Übersicht und Bücherregal laufen noch weiter, weil der Lauf die Automatik nicht anhalten darf. Zum Anhalten unter https://github.com/$GITHUB_REPOSITORY/settings/variables/actions die Variable GHOSTWRITER_ACTIONS_PAUSED mit dem Wert true anlegen (oder GHOSTWRITER_UPDATE_TOKEN das Recht „Variables: Read and write“ geben); im neuen Monat wieder löschen."
              else
                folge="Die Automatik ist angehalten: Prüfung, Übersicht und Bücherregal starten nicht mehr von selbst, die tägliche Update-Prüfung setzt aus. Speichern, Auflagen und von Hand gestartete Läufe gehen weiter. Im neuen Monat läuft alles von selbst wieder an."
              fi
            else
              folge="Noch läuft alles. Ist das Kontingent leer, startet GitHub bis zum neuen Monat keinen Lauf mehr (Bücherregal, Übersicht, Prüfung, Auflagen)."
            fi
            body="$TEXT (Schätzung aus den Läufen dieses Repositorys im laufenden Monat)."$'\n\n'"$folge"$'\n\n'"Was hilft: seltener einzeln speichern, erledigte Arbeits-Branches aufräumen (Actions → Branches aufräumen) oder in den GitHub-Einstellungen (Settings → Billing and plans) ein Ausgabenlimit setzen. Andere private Repositorys desselben Kontos zählen mit. Kontingent und Grenzen: Projekteinstellungen → Limits, docs/UPDATES.md."
            if [ -z "$num" ]; then
              gh issue create --title "$title" --body "$body"
            elif [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/$num" --jq .body)" != "$body" ]; then
              gh issue edit "$num" --body "$body"
            fi
          elif [ "$STATE" = "ok" ] && [ "$PAUSED_VAR" = "true" ] && [ "$FLAG" = "no_permission" ]; then
            # Von Hand gesetzte Pause: Der Lauf darf sie nicht aufheben, also Bescheid geben
            body="Wieder genug Actions-Minuten übrig. Die Automatik ist aber noch angehalten: Bitte unter https://github.com/$GITHUB_REPOSITORY/settings/variables/actions die Variable GHOSTWRITER_ACTIONS_PAUSED löschen. Danach schließt der nächste Lauf dieses Issue."
            if [ -z "$num" ]; then
              gh issue create --title "$title" --body "$body"
            elif [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/$num" --jq .body)" != "$body" ]; then
              gh issue edit "$num" --body "$body"
            fi
          elif [ "$STATE" = "ok" ] && [ -n "$num" ]; then
            gh issue close "$num" --comment "Wieder genug Actions-Minuten übrig (neuer Monat oder höheres Kontingent); die Automatik läuft wieder."
          fi
