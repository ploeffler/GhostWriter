<text x="1500" y="1846.5" text-anchor="middle" font-size="20" fill="#20324A" font-weight="400">Requires explicit confirmation, then new writing permission.</text>
<text x="1500" y="1873.5" text-anchor="middle" font-size="20" fill="#20324A" font-weight="400">Saving and merging are explained in the separate diagram.</text>
<text x="1100" y="2010" text-anchor="middle" font-size="22" fill="#52647B" font-weight="400">Feedback paths show repeated work; new research does not automatically reset an advanced section state.</text>
