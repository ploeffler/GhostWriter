<path d="M 950 510 L 950 550" fill="none" stroke="#3971AD" stroke-width="4" stroke-dasharray="none" marker-end="url(#blue)"/>
<path d="M 950 710 L 950 795" fill="none" stroke="#3971AD" stroke-width="4" stroke-dasharray="none" marker-end="url(#blue)"/>
<rect x="420.0" y="150.0" width="1060" height="160" rx="22" fill="#EAF2FC" stroke="#3971AD" stroke-width="2.5"/>
<text x="950" y="190.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Neues Buch anlegen</text>
<text x="950" y="229.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Arbeitstitel, optional Kurztitel und Autor; eigener Buchbereich entsteht.</text>
<text x="950" y="289.0" text-anchor="middle" font-size="21" fill="#3971AD" font-weight="400">Buch: im Aufbau</text>
<rect x="420.0" y="350.0" width="1060" height="160" rx="22" fill="#EAF2FC" stroke="#3971AD" stroke-width="2.5"/>
<text x="950" y="390.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Konzept und Gliederung entwickeln</text>
<text x="950" y="429.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Thema, Zielgruppe, Stil, Kapitel und Abschnitte abstimmen.</text>
<text x="950" y="489.0" text-anchor="middle" font-size="21" fill="#3971AD" font-weight="400">Konzeption im Gespräch; noch keine weiteren Buchdateien</text>
<rect x="420.0" y="550.0" width="1060" height="160" rx="22" fill="#FFF2D8" stroke="#B37719" stroke-width="2.5"/>
<text x="950" y="590.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Vollständige Struktur ausdrücklich freigeben</text>
<text x="950" y="629.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Danach die Struktur speichern und übernehmen.</text>
<text x="950" y="689.0" text-anchor="middle" font-size="21" fill="#B37719" font-weight="400">Kapitel und Abschnitte: geplant · planned</text>
