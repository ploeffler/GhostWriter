<text x="950" y="1220" text-anchor="middle" font-size="35" fill="#3971AD" font-weight="700">Kapitel für Kapitel</text>
<text x="950" y="1270" text-anchor="middle" font-size="26" fill="#20324A" font-weight="400">Für jedes weitere Kapitel</text>
<text x="950" y="1304" text-anchor="middle" font-size="26" fill="#20324A" font-weight="400">diesen Kreis wiederholen.</text>
<text x="395" y="1140" text-anchor="middle" font-size="23" fill="#3971AD" font-weight="400">nächstes</text>
<text x="395" y="1171" text-anchor="middle" font-size="23" fill="#3971AD" font-weight="400">Kapitel</text>
<text x="150" y="1645" text-anchor="middle" font-size="22" fill="#3971AD" font-weight="400">zur</text>
<text x="150" y="1675" text-anchor="middle" font-size="22" fill="#3971AD" font-weight="400">Auflage</text>
<rect x="525.0" y="800.0" width="850" height="200" rx="22" fill="#EAF2FC" stroke="#3971AD" stroke-width="2.5"/>
<text x="950" y="840.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Erstellungskreislauf je Abschnitt</text>
<text x="950" y="879.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Siehe eigenes rundes Diagramm.</text>
<text x="950" y="910.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Wiederholen, bis alle Abschnitte dieses Kapitels freigegeben sind.</text>
<text x="950" y="979.0" text-anchor="middle" font-size="21" fill="#3971AD" font-weight="400">Kapitel: in Bearbeitung · in_progress</text>
<rect x="966.0" y="1400.0" width="660" height="200" rx="22" fill="#EAF2FC" stroke="#3971AD" stroke-width="2.5"/>
<text x="1296" y="1440.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Kapitel zusammenführen und prüfen</text>
<text x="1296" y="1479.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Alle Abschnitte freigegeben → zusammenführen</text>
<text x="1296" y="1510.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Durchsicht → bereit zur Kapitelfreigabe</text>
<text x="1296" y="1554.0" text-anchor="middle" font-size="21" fill="#3971AD" font-weight="400">ready_for_assembly → assembly</text>
<text x="1296" y="1583.0" text-anchor="middle" font-size="21" fill="#3971AD" font-weight="400">review → ready_for_approval</text>
<rect x="274.0" y="1400.0" width="660" height="200" rx="22" fill="#FFF2D8" stroke="#B37719" stroke-width="2.5"/>
<text x="604" y="1440.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Kapitel ausdrücklich freigeben</text>
<text x="604" y="1479.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Du bestätigst die zusammengeführte Fassung.</text>
<text x="604" y="1579.0" text-anchor="middle" font-size="21" fill="#B37719" font-weight="400">Kapitel: freigegeben · approved</text>
<path d="M 1550 1400 Q 1730 1090 1385 925" fill="none" stroke="#7865A5" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#purple)"/>
<text x="1680" y="1110" text-anchor="middle" font-size="21" fill="#7865A5" font-weight="400">bei nötigen</text>
<text x="1680" y="1139" text-anchor="middle" font-size="21" fill="#7865A5" font-weight="400">Änderungen</text>
<path d="M 950 1910 L 950 1950" fill="none" stroke="#3971AD" stroke-width="4" stroke-dasharray="none" marker-end="url(#blue)"/>
<path d="M 950 2140 L 950 2180" fill="none" stroke="#3971AD" stroke-width="4" stroke-dasharray="none" marker-end="url(#blue)"/>
<path d="M 950 2370 L 950 2410" fill="none" stroke="#3971AD" stroke-width="4" stroke-dasharray="none" marker-end="url(#blue)"/>
<rect x="270.0" y="1710.0" width="1360" height="200" rx="22" fill="#EAF2FC" stroke="#3971AD" stroke-width="2.5"/>
<text x="950" y="1750.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Neue Auflage anfordern und Voraussetzungen prüfen</text>
<text x="950" y="1789.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Mindestens ein freigegebenes Kapitel; enthaltene Abschnitte freigegeben.</text>
<text x="950" y="1820.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Keine offenen Marker; offene Buchänderungen zuerst übernehmen.</text>
<text x="950" y="1889.0" text-anchor="middle" font-size="21" fill="#3971AD" font-weight="400">Bei Hindernissen zurück zur betroffenen Arbeit</text>
<rect x="270.0" y="1940.0" width="1360" height="200" rx="22" fill="#FFF2D8" stroke="#B37719" stroke-width="2.5"/>
<text x="950" y="1980.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Auflage vorbereiten und Übernahme bestätigen</text>
<text x="950" y="2019.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Release Notes freigeben; eigenes Änderungspaket für die Auflage.</text>
<text x="950" y="2050.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Du bestätigst die Übernahme – auch bei aktiviertem „sofort übernehmen“.</text>
<text x="950" y="2119.0" text-anchor="middle" font-size="21" fill="#B37719" font-weight="400">Auflage vorbereitet, noch nicht veröffentlicht</text>
<rect x="270.0" y="2170.0" width="1360" height="200" rx="22" fill="#EAF2FC" stroke="#3971AD" stroke-width="2.5"/>
<text x="950" y="2210.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Ausgabedateien erzeugen</text>
<text x="950" y="2249.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Nach der Übernahme baut GitHub die gewählten Formate.</text>
<text x="950" y="2280.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Bei Fehlern prüfen und beheben; noch keine fertige Auflage.</text>
<text x="950" y="2349.0" text-anchor="middle" font-size="21" fill="#3971AD" font-weight="400">Erzeugung läuft</text>
<rect x="270.0" y="2410.0" width="1360" height="180" rx="22" fill="#E4F4ED" stroke="#2D8061" stroke-width="2.5"/>
<text x="950" y="2450.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Auflage veröffentlicht</text>
<text x="950" y="2489.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Release mit Tag und Dateien · PDF / DOCX / EPUB</text>
<text x="950" y="2569.0" text-anchor="middle" font-size="21" fill="#2D8061" font-weight="400">Fertige Auflage · dieser veröffentlichte Buchstand bleibt unverändert</text>
<rect x="85.0" y="2650.0" width="1730" height="180" rx="22" fill="#F0EDF9" stroke="#7865A5" stroke-width="2.5"/>
<text x="950" y="2690.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Weitere Wege</text>
<text x="950" y="2729.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Probedruck auf Wunsch: gekennzeichnetes PDF des übernommenen Stands, keine Auflage.</text>
<text x="950" y="2760.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Korrekturen / nächste Auflage: betroffene Freigaben ausdrücklich zurücknehmen und wieder am Kapitel arbeiten.</text>
