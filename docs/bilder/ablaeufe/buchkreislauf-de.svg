<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2870" viewBox="0 0 1900 2870"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3971AD"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7865A5"/></marker></defs><rect width="1900" height="2870" fill="#FAFBFD"/><g font-family="DejaVu Sans, sans-serif">
<text x="950" y="75" text-anchor="middle" font-size="43" fill="#20324A" font-weight="700">Vom neuen Buch zur fertigen Auflage</text>
<text x="950" y="121" text-anchor="middle" font-size="25" fill="#20324A" font-weight="400">Einmal einrichten · Kapitelweise im Kreis arbeiten · Auflage ausdrücklich veröffentlichen</text>
