<text x="950" y="1789.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">At least one approved chapter; all included sections approved.</text>
<text x="950" y="1820.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">No unresolved markers; merge pending book changes first.</text>
<text x="950" y="1889.0" text-anchor="middle" font-size="21" fill="#3971AD" font-weight="400">If blocked, return to the affected work</text>
<rect x="270.0" y="1940.0" width="1360" height="200" rx="22" fill="#FFF2D8" stroke="#B37719" stroke-width="2.5"/>
<text x="950" y="1980.0" text-anchor="middle" font-size="29" fill="#20324A" font-weight="700">Prepare the edition and confirm its merge</text>
<text x="950" y="2019.0" text-anchor="middle" font-size="23" fill="#20324A" font-weight="400">Approve release notes; prepare a separate edition change package.</text>
