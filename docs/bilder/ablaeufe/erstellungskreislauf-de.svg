<text x="1100" y="2010" text-anchor="middle" font-size="22" fill="#52647B" font-weight="400">Rückwege zeigen die Arbeitsschleifen; neue Recherche setzt einen späteren Abschnittszustand nicht automatisch zurück.</text>
