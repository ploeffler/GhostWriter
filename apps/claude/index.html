<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GhostWriter für Claude</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2296%22 height=%2296%22 viewBox=%220 0 96 96%22 role=%22img%22%3E%3Ctitle%3EGhostWriter App-Symbol%3C/title%3E%3Crect width=%2296%22 height=%2296%22 rx=%2222%22 fill=%22#374151%22/%3E%3Cg transform=%22translate%280 -1%29%22%3E%3Cpath d=%22M70 12 C 48 18, 32 36, 28 62 L 34 64 C 40 44, 52 30, 70 12 Z%22 fill=%22#D1D5DB%22/%3E%3Cpath d=%22M70 12 C 74 30, 64 48, 40 62 L 34 64 C 52 48, 62 32, 70 12 Z%22 fill=%22#F07F2E%22/%3E%3Cpath d=%22M28 62 L 22 80 L 34 64 Z%22 fill=%22#F3F4F6%22/%3E%3Cpath d=%22M22 80 q 6 -6 12 0 t 12 0 t 12 0%22 fill=%22none%22 stroke=%22#6FBF8A%22 stroke-width=%225%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2252%22 cy=%2238%22 r=%223%22 fill=%22#374151%22/%3E%3Ccircle cx=%2260%22 cy=%2230%22 r=%223%22 fill=%22#374151%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/icons.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
/* VOICE: GhostWriter selbst – dieselben Widgets wie im Chat, nur ohne Chat dazwischen.
   IDEA: der Chat-Verlauf wird zur App: oben die Ansicht, daneben Claude.
   PICTURE: das jeweilige GhostWriter-Widget (Bücherregal, Projektübersicht, Kapitel, Abschnitt).
   COLOUR and TYPE: Host-Variablen wie im Claude-Chat, Akzent GhostWriter-Orange; Systemschrift wie die Widgets.
   LAYOUT: Kopfzeile, Widget mittig bis 900px; im Abschnitt Widget links, Claude rechts, unter 1100px gestapelt. */
:root{color-scheme:light dark;
  --surface-1:light-dark(#ffffff,#262624);--surface-2:light-dark(#f7f6f3,#30302e);--bg-page:light-dark(#faf9f5,#1f1e1d);
  --text-primary:light-dark(#141413,#f5f4ef);--text-secondary:light-dark(#3d3d3a,#c2c0b6);--text-muted:light-dark(#73726c,#9a988e);
  --text-accent:light-dark(#b4560f,#f0a060);--bg-accent:light-dark(#fdf0e4,#3a2a1d);--border-accent:light-dark(#e8a36a,#a8602a);
  --border:light-dark(rgb(31 30 29/.15),rgb(222 220 209/.15));--border-strong:light-dark(rgb(31 30 29/.3),rgb(222 220 209/.3));--border-stronger:light-dark(rgb(31 30 29/.45),rgb(222 220 209/.45));
  --text-warning:light-dark(#8a5a00,#f0c56b);--bg-warning:light-dark(#fff7e0,#33290f);--border-warning:light-dark(#e6c36a,#7a6220);
  --text-danger:light-dark(#b3261e,#ff8a80);--bg-danger:light-dark(#fdecea,#3a1b19);--border-danger:light-dark(#f0a39d,#8a3a33);
  --text-success:light-dark(#1f7a4a,#6fd39d);--bg-success:light-dark(#e8f6ee,#17301f);--border-success:light-dark(#8fd0ab,#2f6b46);
  --radius:0;--gap-xs:4px;--gap-sm:8px;--gap-md:12px;--gap-lg:20px;--pad-sm:8px;--pad-md:12px;--pad-lg:16px;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg-page);color:var(--text-primary);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
a{color:var(--text-accent)}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px max(3vw,14px);background:var(--surface-1);border-bottom:.5px solid var(--border)}
.brand{display:flex;gap:8px;align-items:center;font-weight:600;font-size:17px;border:0;background:none;padding:0;cursor:pointer}
.brand svg{width:30px;height:30px;flex:none;margin:-3px 0}.logo-a{fill:light-dark(#6B7280,#D1D5DB)}.logo-b{fill:#F07F2E}.logo-c{fill:light-dark(#374151,#F3F4F6)}.logo-w{fill:none;stroke:light-dark(#4F9D69,#6FBF8A);stroke-width:4.5;stroke-linecap:round}.logo-d{fill:light-dark(#F3F4F6,#374151)}
.crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;color:var(--text-muted);font-size:14px;flex:1}
.crumbs button{min-height:34px;border:0;padding:0 6px;background:none;color:var(--text-muted);cursor:pointer}
.crumbs button:hover{color:var(--text-primary)}
main{max-width:1320px;margin:0 auto;padding:clamp(16px,3vw,32px) max(3vw,14px) 60px}
.one{max-width:900px;margin:0 auto}
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:20px;align-items:start}
@media(max-width:1100px){.desk{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface-1);border:.5px solid var(--border);padding:var(--pad-lg)}
.btn{min-height:40px;border:.5px solid var(--border-strong);background:var(--surface-1);padding:0 14px;cursor:pointer}
.btn.pri{background:#e8731c;border-color:#e8731c;color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.link{border:0;background:none;padding:0;color:var(--text-accent);text-decoration:underline;cursor:pointer;font-size:14px}
:focus-visible{outline:2px solid #e8731c;outline-offset:2px}
input.in,textarea.in{width:100%;border:.5px solid var(--border-strong);background:var(--surface-1);padding:10px 12px;font-size:16px}
.note{padding:10px 14px;margin:0 0 14px;font-size:14px;border:.5px solid}
.note.ok{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success)}
.note.warn{background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning)}
.note.err{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger)}
.note.info{background:var(--surface-2);color:var(--text-secondary);border-color:var(--border)}
.note pre{white-space:pre-wrap;font:12px/1.45 var(--font-mono);background:var(--surface-1);border:.5px solid var(--border);padding:8px;margin:8px 0 0;color:var(--text-secondary)}
.dim{color:var(--text-muted);font-size:14px}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:.5px solid var(--border)}
.chk li:first-child{border-top:0}
.chk .w{font-size:13px;color:var(--text-muted)}.chk .nt{grid-column:1/-1;font-size:13px;color:var(--text-muted)}
.res{font-size:12px;font-weight:600;white-space:nowrap;padding:1px 7px;border:.5px solid currentColor;align-self:start}
.res.passed{color:var(--text-success)}.res.passed_with_notes{color:var(--text-accent)}.res.failed{color:var(--text-danger)}.res.incomplete,.res.unknown{color:var(--text-muted)}
.report h1{font-size:26px;line-height:1.15;margin:0 0 12px}.report h2{font-size:19px;margin:20px 0 6px}.report h3{font-size:16px;margin:14px 0 4px}
.report p,.report li{max-width:76ch}.report blockquote{margin:0 0 10px;padding:6px 12px;border-left:3px solid #e8731c}
aside.claude{position:sticky;top:70px;display:flex;flex-direction:column;max-height:calc(100vh - 90px);background:var(--surface-1);border:.5px solid var(--border)}
@media(max-width:1100px){aside.claude{position:static;max-height:none}}
.ch-head{padding:12px 14px;border-bottom:.5px solid var(--border)}.ch-head b{font-size:15px}.ch-head p{margin:2px 0 0;font-size:12px;color:var(--text-muted)}
.msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:140px}
.msg{font-size:14px;line-height:1.55}.msg.u{align-self:flex-end;background:var(--bg-accent);padding:7px 11px;max-width:90%}
.msg.a p{margin:0 0 7px}.msg.a ul,.msg.a ol{margin:0 0 7px;padding-left:20px}.msg.a h4{margin:8px 0 3px;font-size:14px}
.msg.a code{background:var(--surface-2);padding:0 4px}.msg.a blockquote{margin:0 0 7px;padding:6px 10px;border-left:3px solid #e8731c;background:var(--surface-2);white-space:pre-wrap}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.quick button{min-height:32px;font-size:12px;border:.5px solid var(--border-strong);background:var(--surface-1);padding:0 10px;cursor:pointer}
.ask{display:flex;gap:8px;padding:10px 14px;border-top:.5px solid var(--border)}
.ask textarea{min-height:40px;max-height:150px;resize:vertical}
#gw *:not(.spin){border-radius:0 !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:#e8731c;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(1turn)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header>
  <button class="brand" id="home"><svg viewBox="0 0 96 96" aria-hidden="true"><g transform="translate(4 2)"><path class="logo-a" d="M70 12 C 48 18, 32 36, 28 62 L 34 64 C 40 44, 52 30, 70 12 Z"/><path class="logo-b" d="M70 12 C 74 30, 64 48, 40 62 L 34 64 C 52 48, 62 32, 70 12 Z"/><path class="logo-c" d="M28 62 L 22 80 L 34 64 Z"/><path class="logo-w" d="M22 80 q 6 -6 12 0 t 12 0 t 12 0"/><circle class="logo-d" cx="52" cy="38" r="3"/><circle class="logo-d" cx="60" cy="30" r="3"/></g></svg>GhostWriter</button>
  <nav class="crumbs" id="crumbs" aria-label="Pfad"></nav>
</header>
<main id="app"><p class="dim"><span class="spin"></span>Wird geladen …</p></main>
<script>
{
const GH = "github";
const EDITORIAL = ["structure","language","proofreading","story_memory","quality_correction"];
const LABEL = {structure:["Struktur","S"],language:["Sprache","L"],proofreading:["Korrektur","K"],story_memory:["Gedächtnis","G"],quality_correction:["Qualität","Q"]};
const KIND_LONG = {structure:"Strukturlektorat",language:"Sprachlektorat",proofreading:"Schlusskorrektur",story_memory:"Buchgedächtnis",quality_correction:"Qualitätsprüfung"};
const ANA = {characters:"Figuren",summaries:"Kurzbeschreibungen",style:"Stil",places:"Schauplätze",timeline:"Zeitleiste",continuity:"Widersprüche",language:"Sprache",chronology:"Chronologie"};
const ANA_SHORT = {characters:"AF",summaries:"AK",style:"ASt",places:"AO",timeline:"AZ",continuity:"AW",language:"ASp",chronology:"AC"};
const MARK = {passed:"✓",passed_with_notes:"✓·",failed:"✗",incomplete:"…",unknown:"?"};
const RES = {passed:"bestanden",passed_with_notes:"bestanden mit Hinweisen",failed:"nicht bestanden",incomplete:"unvollständig",unknown:"Ergebnis unbekannt"};
const STATE = {current:"aktuell",changed:"seit Prüfung geändert",unknown:"Stand unbekannt"};
const LEGEND = "Prüfungen: S Struktur · L Sprache · K Korrektur · G Gedächtnis · Q Qualität · A… Analyse · ✓ bestanden · ✓· mit Hinweisen · ✗ nicht bestanden · … unvollständig · * seit Prüfung geändert · ? Stand bzw. Ergebnis unbekannt.";
const LEGEND_LATEST = LEGEND + " Ein Tag zeigt nur die neueste Prüfung je Art. Ein Tag ist keine Freigabe.";
const LEGEND_FULL = LEGEND + " Ein Tag zeigt nur die neueste Prüfung je Art; frühere stehen unter „Frühere Prüfungen“. Ein Tag ist keine Freigabe.";
const MK = {"PLATZHALTER-ANEKDOTE":"anekdote","QUELLE PRÜFEN":"quelle","MEDIZIN PRÜFEN":"medizin","RECHT PRÜFEN":"recht","KONTINUITÄT PRÜFEN":"kontinuitaet"};
const MK_LABEL = {anekdote:"Platzhalter-Anekdote",quelle:"Quelle prüfen",medizin:"Medizin prüfen",recht:"Recht prüfen",kontinuitaet:"Kontinuität prüfen"};
const MARKER_RE = /\[(PLATZHALTER-ANEKDOTE|QUELLE PRÜFEN|MEDIZIN PRÜFEN|RECHT PRÜFEN|KONTINUITÄT PRÜFEN)(?::\s*([^\]]*))?\]/g;

const S = {mcp:null, sample:null, ready:false, owner:"", repo:"", lib:null, book:null, idx:null, cfg:{}, readRef:"", head:"", pr:null, checks:[], files:new Map(), view:"", sec:null, secNo:"", secFile:null, chap:null, msg:null, chat:[], busy:false, report:null, showAll:false, rules:"", webJobs:{}};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const deDate = iso => { const m = /(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? `${m[3]}.${m[2]}.${m[1]}` : ""; };
const rankOf = (e, i) => whenOf(e) + "|" + String(i).padStart(6, "0");

/* ---------- GitHub über den Konnektor ---------- */
function errText(e){
  const c = e && e.code, m = (e && e.message) || String(e);
  if (c === "server_not_connected") return "GitHub ist in deinem Claude-Konto nicht verbunden: claude.ai → Einstellungen → Konnektoren → github verbinden, dann die Seite neu laden.";
  if (c === "needs_reauth") return "Die GitHub-Verbindung ist abgelaufen. Verbinde github unter claude.ai → Einstellungen → Konnektoren neu.";
  if (c === "selection_required") return "Du hast mehrere GitHub-Konnektoren. Wähle in der Abfrage von Claude einen aus und versuche es erneut.";
  if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "Diese App darf GitHub noch nicht benutzen. Erlaube den Zugriff in der Abfrage von Claude („Weiter“) und versuche es erneut.";
  if (c === "blocked_by_policy") return "Deine Organisation erlaubt diesen GitHub-Zugriff nicht.";
  if (c === "server_unavailable") return "GitHub antwortet gerade nicht. Bitte gleich noch einmal versuchen.";
  if (/404|not found/i.test(m)) return "Nicht gefunden. Prüfe den Namen des Repositorys. Ist es privat, muss die GitHub-App „Claude Github MCP Connector“ auf dem Konto installiert sein, dem das Repository gehört: github.com/apps/claude-github-mcp-connector → Install → Repository freigeben.";
  if (/403|permission|forbidden/i.test(m)) return "GitHub verweigert den Zugriff. Die GitHub-App braucht Schreibrechte für dieses Repository.";
  return "Fehler: " + m.slice(0, 300);
}
const call = (tool, input) => S.mcp ? S.mcp.callTool(GH, tool, input, {cache:false}) : Promise.reject({code:"server_not_connected", message:"no mcp"});
function fileOf(res){
  let text = null, sha = null, commit = null;
  for (const b of (res && res.content) || []){
    if (b.type === "resource" && b.resource){ if (typeof b.resource.text === "string") text = b.resource.text; const m = /\/sha\/([0-9a-f]{40})\//.exec(b.resource.uri || ""); if (m) commit = m[1]; }
    else if (b.type === "text"){ const m = /SHA:\s*([0-9a-f]{40})/.exec(b.text); if (m) sha = m[1]; else if (text === null) text = b.text; }
  }
  return {text, sha, commit};
}
async function getFile(path, ref, fresh){
  const key = (ref || "") + "|" + path;
  if (!fresh && S.files.has(key)) return S.files.get(key);
  const input = {owner:S.owner, repo:S.repo, path};
  if (ref) input.ref = "refs/heads/" + ref;
  const f = fileOf(await call("get_file_contents", input));
  if (f.text === null) throw {message:"Datei nicht lesbar: " + path};
  S.files.set(key, f);
  return f;
}
async function pool(items, n, fn){ const out = new Array(items.length); let i = 0; await Promise.all(Array.from({length:Math.min(n, items.length)}, async () => { while (i < items.length){ const k = i++; try { out[k] = await fn(items[k]); } catch (e) { out[k] = null; } } })); return out; }
const workOf = b => b.work_branch || "ghostwriter/" + b.branch;
async function openPR(b){
  const res = await call("list_pull_requests", {owner:S.owner, repo:S.repo, state:"open", head:S.owner + ":" + workOf(b), base:b.branch, perPage:5});
  const p = Array.isArray(res.payload) ? res.payload[0] : null;
  return p ? {number:p.number, url:p.html_url, head:p.head && p.head.sha} : null;
}
async function prCommits(pr){
  try { const c = await call("pull_request_read", {method:"get_commits", owner:S.owner, repo:S.repo, pullNumber:pr.number, perPage:100}); pr.list = Array.isArray(c.payload) ? c.payload : []; pr.commits = pr.list.length || 1; } catch (e) { pr.list = []; pr.commits = 1; }
  return pr;
}

/* ---------- Abschnittsdateien ---------- */
function part(text, name){ const re = new RegExp("^## " + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\n\\n([\\s\\S]*?)(?=^## |(?![\\s\\S]))", "m"); const m = re.exec(text); const v = m ? m[1].trim() : ""; return v === "Offen." ? "" : v; }
const msOf = t => { const k = "\n## Manuskript\n", i = t.indexOf(k); return i < 0 ? "" : t.slice(i + k.length).trim(); };
function front(t){ const m = /^---\n([\s\S]*?)\n---\n/.exec(t); try { return (m && window.jsyaml && window.jsyaml.load(m[1])) || {}; } catch (e) { return {}; } }
function words(t){ t = t.replace(/<!--[\s\S]*?-->/g, " ").replace(/^\[\^[^\]]+\]:.*(?:\n(?: {2,}|\t).*)*/gm, " ").replace(/\[\^[^\]]+\]/g, " "); return (t.match(/[\p{L}\p{N}_][\p{L}\p{N}_'’-]*/gu) || []).length; }
const fmtNum = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
function block(md, h){
  const re = new RegExp("^## " + h.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[ \\t]*\\n", "m"), m = re.exec(md); if (!m) return null;
  const start = m.index + m[0].length, n = /^## /m.exec(md.slice(start)); return {start, end: n ? start + n.index : md.length};
}
function setBlock(md, h, val){ const b = block(md, h); if (!b) return md; const tail = md.slice(b.end); return md.slice(0, b.start) + "\n" + (val.replace(/\s+$/, "") || "Offen.") + "\n" + (tail ? "\n" : "") + tail; }
function setFact(md, v){ return md.replace(/^(---\n[\s\S]*?^fact_check:[ \t]*)(\S+)/m, (all, a) => a + v); }
async function sha16(t){ try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t.trim())); return "sha256:" + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 16); } catch (e) { return null; } }
const chapters = () => S.struct || [];
const allSecs = () => chapters().flatMap(c => (c.sections || []).map(s => ({c, s})));
const cached = path => S.files.get(S.readRef + "|" + path);
async function loadSecFiles(list, label){
  let done = 0; const todo = list.filter(({s}) => !cached(s.path)).length;
  const tick = () => { const el = document.querySelector("#app .dim"); if (label && el && todo > 3) el.innerHTML = `<span class="spin"></span>${esc(label)} – Abschnitt ${done} von ${todo}`; };
  return pool(list, 10, async ({s}) => { const was = !!cached(s.path); const f = await getFile(s.path, S.readRef); if (!f.dg) f.dg = await sha16(msOf(f.text)); if (!was){ done++; tick(); } return f; });
}

/* ---------- Prüfprotokoll (wie scripts/checks.py) ---------- */
const whenOf = e => (String(e.date || "") + (e.time ? " " + e.time : "")).trim();
function label(kind){ if (kind.startsWith("analysis:")){ const a = kind.slice(9); return ["Analyse " + (ANA[a] || a), ANA_SHORT[a] || "A"]; } return LABEL[kind] || [kind, kind[0].toUpperCase()]; }
function resolve(scope){ const sc = Array.isArray(scope) ? scope : [scope]; return allSecs().filter(({c, s}) => sc.includes("book") || sc.includes(c.id) || sc.includes(s.id)).map(({s}) => s.id); }
function nowDigest(id){ const x = allSecs().find(v => v.s.id === id); const f = x && cached(x.s.path); return f && f.dg; }
function stateOf(e, hit){
  const saved = e.digests || {}, cov = hit.filter(i => i in saved);
  if (!cov.length) return "unknown";
  let unknown = false;
  for (const i of cov){ const n = nowDigest(i); if (!n){ unknown = true; continue; } if (n !== saved[i]) return "changed"; }
  return unknown ? "unknown" : "current";
}
function localize(t){
  const [name, short] = label(t.CK_KIND), mark = MARK[t.CK_RESULT] || "";
  let suf = {changed:"*", unknown:"?"}[t.CK_STATE] || ""; if (mark === "?" && suf === "?") suf = "";
  return Object.assign(t, {CK_LABEL:name, CK_SHORT:short, CK_MARK:mark, CK_RESULT_TEXT:RES[t.CK_RESULT] || t.CK_RESULT, CK_STATE_TEXT:STATE[t.CK_STATE],
    CK_TEXT:`${name}: ${RES[t.CK_RESULT] || t.CK_RESULT}, ${t.CK_WHEN || t.CK_DATE} · ${STATE[t.CK_STATE]}` + (t.CK_PARTIAL ? " · teilweise" : ""),
    CK_TAG:short + mark + suf, CK_PILL:(name + " " + mark + suf).trim()});
}
function touching(unit){ const out = []; S.checks.forEach((e, i) => { const hit = resolve(e.scope || []).filter(x => unit.has(x)); if (hit.length) out.push([i, e, hit]); }); return out; }
function mkTag(e, hit, unit){ return localize({CK_KIND:e.kind, CK_RESULT:e.result, CK_DATE:String(e.date || ""), CK_WHEN:whenOf(e), CK_REPORT:e.report || "", CK_STATE:stateOf(e, hit), CK_PARTIAL:hit.length < unit.size ? "1" : "", CK_ID:String(e.id || ""), CK_NOTE:e.note || ""}); }
const kindOrder = k => { const i = EDITORIAL.indexOf(k); return i < 0 ? 99 : i; };
function tagsFor(ids){
  const unit = new Set(ids); if (!unit.size || !S.checks.length) return [];
  const latest = {};
  for (const [i, e, hit] of touching(unit)){ const r = rankOf(e, i); if (!latest[e.kind] || r >= latest[e.kind][0]) latest[e.kind] = [r, e, hit]; }
  return Object.entries(latest).sort((a, b) => (kindOrder(a[0]) - kindOrder(b[0])) || a[0].localeCompare(b[0])).map(([, v]) => mkTag(v[1], v[2], unit));
}
function historyFor(ids){
  const unit = new Set(ids); if (!unit.size || !S.checks.length) return [];
  const hits = touching(unit).sort((a, b) => rankOf(b[1], b[0]).localeCompare(rankOf(a[1], a[0])));
  const seen = new Set(), out = [];
  for (const [, e, hit] of hits){ if (!seen.has(e.kind)){ seen.add(e.kind); continue; } out.push(mkTag(e, hit, unit)); }
  return out;
}

  const seen = new Set(), out = [];

    const swap = (b, html, on) => { const n = b.cloneNode(false); n.innerHTML = html; n.dataset.available = on ? "true" : "false"; n.disabled = !on; b.replaceWith(n); return n; };
    const sched = card.querySelector('.gw-opt[data-mode="zeitgesteuert"]'), now = card.querySelector('.gw-opt[data-mode="sofort"]');

function mdDoc(t){
  const L = esc(t.replace(/^---\n[\s\S]*?\n---\n/, "")).split("\n"), out = []; let list = null;
  const inl = x => x.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  for (const l of L){
    const li = /^\s*(?:[-*]|\d+[.)])\s+(.*)/.exec(l);
    if (li){ if (!list){ list = /^\s*\d/.test(l) ? "ol" : "ul"; out.push(`<${list}>`); } out.push(`<li>${inl(li[1])}</li>`); continue; }
    if (list){ out.push(`</${list}>`); list = null; }
    const h = /^(#{1,4})\s+(.*)/.exec(l);
    if (h) out.push(`<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`);
    else if (/^&gt;\s?/.test(l)) out.push(`<blockquote>${inl(l.replace(/^&gt;\s?/, ""))}</blockquote>`);
    else if (/^\s*\|/.test(l)) out.push(`<p><code>${l}</code></p>`);
    else if (l.trim() && !/^-{3,}$/.test(l.trim())) out.push(`<p>${inl(l)}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join("");
}

async function prepareWork(){
  const b = S.book, work = workOf(b);
  if (await openPR(b)) return work;
  const bk = await getFile("ghostwriter.yml", b.branch, true);
  const wk = await getFile("ghostwriter.yml", work, true).catch(() => null);
  if (!wk){ await call("create_branch", {owner:S.owner, repo:S.repo, branch:work, from_branch:b.branch}); return work; }
  if (wk.commit && bk.commit && wk.commit === bk.commit) return work;
  // Arbeits-Branch ist älter als das Buch: erst auf den Buchstand bringen (nur Buch → Arbeits-Branch)
  try {
    await call("create_pull_request", {owner:S.owner, repo:S.repo, head:b.branch, base:work, title:`GhostWriter: Arbeits-Branch auf den Stand von ${b.branch} bringen`, body:"Automatisch vor dem nächsten Speichern: übernimmt den aktuellen Buchstand in den Arbeits-Branch. Das Buch selbst ändert sich dadurch nicht."});
    const r = await call("list_pull_requests", {owner:S.owner, repo:S.repo, state:"open", head:S.owner + ":" + b.branch, base:work, perPage:5});
    const p = Array.isArray(r.payload) && r.payload[0];
    if (p) await call("merge_pull_request", {owner:S.owner, repo:S.repo, pullNumber:p.number, merge_method:"merge", commit_title:`Buchstand von ${b.branch} in den Arbeits-Branch übernommen`});
  } catch (e) { if (!/no commits|nothing to compare|already/i.test((e && e.message) || "")) throw e; }
  return work;
}

  await call("push_files", {owner:S.owner, repo:S.repo, branch:work, files, message:message + "\n\nGhostWriter für Claude" + (opts && opts.action ? `\nGhostWriter-Aktion: ${opts.action}` : "")});
  let pr = await openPR(b), note = "";

function projectSet(text, key, value){

  let end = pi + 1; while (end < L.length && (L[end].trim() === "" || /^ {2}/.test(L[end]))) end++;
  const re = new RegExp("^  " + key + ":"), i = L.findIndex((l, k) => k > pi && k < end && re.test(l));
  if (value === null){ if (i >= 0) L.splice(i, 1); return L.join("\n"); }
  if (i >= 0){ const m = /^(  [a-z_]+:[ \t]*)("(?:[^"\\]|\\.)*"|\[[^\]]*\]|[^#]*?)([ \t]*#.*)?$/.exec(L[i]); L[i] = m ? m[1] + value + (m[3] || "") : `  ${key}: ${value}`; }

}

function charListWrite(gy, items){

  const block = items.length ? "characters:\n" + items.map(i => `- id: ${i.id}\n  name: ${yq(i.name)}\n  path: ${i.path}\n`).join("") : "";
  const m = /^characters:.*\n(?:(?:[ -].*|)\n)*/m.exec(gy);
  let out;
  if (m) out = gy.slice(0, m.index) + block + gy.slice(m.index + m[0].length);
  else { const st = /^structure:/m.exec(gy); if (!st) throw {message:"ghostwriter.yml: structure nicht gefunden."}; out = gy.slice(0, st.index) + block + gy.slice(st.index); }
  const back = (window.jsyaml.load(out) || {}).characters || [];
  if (back.length !== items.length || back.some((b, i) => b.id !== items[i].id || b.name !== items[i].name)) throw {message:"ghostwriter.yml ließ sich nicht sicher ändern; bitte im Chat mit GhostWriter anlegen."};
  return out;
}

/* Figuren aus dem Text vorschlagen (#53): Claude liest die Texte, es entsteht nur ein Vorschlag; übernommen wird nach Auswahl */
const SUGGEST_FIELDS = ["role", "short", "age", "appearance", "traits", "voice"], SUGGEST_SIZE = 40000;
function suggestScope(scope){
  // → {scope: book | N | N.M, list: [[Schlüssel, Titel, Abschnitt]]} oder null (Teile von Vor-/Nachspann und Serien gibt es hier noch nicht)
  const chs = chapters(); scope = String(scope || "book").trim();

  if (scope === "book" || scope === "buch") return {scope:"book", list:allSecs().map(({c, s}) => sec(chs.indexOf(c), c.sections.indexOf(s)))};
  if (/^\d+$/.test(scope)){ const ci = +scope - 1; return chs[ci] ? {scope, list:chs[ci].sections.map((x, si) => sec(ci, si))} : null; }
  if (/^\d+\.\d+$/.test(scope)){ const [a, b] = scope.split(".").map(Number); return chs[a - 1] && chs[a - 1].sections[b - 1] ? {scope, list:[sec(a - 1, b - 1)]} : null; }
  const x = allSecs().find(v => v.s.id === scope); if (x){ const ci = chs.indexOf(x.c), si = x.c.sections.indexOf(x.s); return {scope:`${ci + 1}.${si + 1}`, list:[sec(ci, si)]}; }
  const ci = chs.findIndex(c => c.id === scope); return ci >= 0 ? {scope:String(ci + 1), list:chs[ci].sections.map((y, si) => sec(ci, si))} : null;
}
const scopeText = sc => sc === "book" ? "ganzes Buch" : /^\d+$/.test(sc) ? "Kapitel " + sc : "Abschnitt " + sc;
function parseSuggest(text){
  const m = /```(?:json)?\s*([\s\S]*?)```/.exec(text) || [null, text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1)];

}
const norm = t => String(t || "").replace(/\s+/g, " ").trim().toLowerCase();
function mergeSuggest(into, items){
  for (const it of items){
    if (!it || !String(it.name || "").trim()) continue;
    const names = [it.name, ...(it.aliases || [])].map(norm);
    const hit = into.find(x => [x.name, ...(x.aliases || [])].map(norm).some(n => names.includes(n)));
    if (!hit){ into.push(Object.assign({aliases:[], traits:[], relations:[], sections:[], evidence:[]}, it)); continue; }
    ["role", "short", "age", "appearance", "voice"].forEach(k => { if (!hit[k] && it[k]) hit[k] = it[k]; });
    const add = (k, key) => { (it[k] || []).forEach(v => { if (!(hit[k] || (hit[k] = [])).some(w => key(w) === key(v))) hit[k].push(v); }); };

}
async function characterSuggest(d){

    const blocks = sc.list.map(([key, title, s], i) => { const ms = files[i] ? msOf(files[i].text).trim() : ""; return EMPTY_MS.includes(ms) ? null : {key, text:`### ${key} ${title}\n\n${ms}\n`}; }).filter(Boolean);

      return {S_IDX:i, S_NAME:it.name, S_ALIASES:(it.aliases || []).join(", "), S_ROLE:["main", "supporting", "minor"].includes(it.role) ? it.role : "supporting", S_SHORT:it.short || "", S_DETAILS:details, S_SECTIONS:(it.sections || []).join(", "),
        S_EVIDENCE:(it.evidence || []).slice(0, 3).map(e => `${e.where || ""}: „${e.quote}“`).join(" · "), S_STATE:hit ? "existing" : "new", S_EXISTING:hit ? hit.name : "", S_STATE_TEXT:hit ? "schon da: " + hit.name : "neu"};
    });

    return form("figuren-vorschlag", Object.assign(base(), {SCOPE:sc.scope, SCOPE_TEXT:scopeText(sc.scope), SUGGEST_COUNT_TEXT:plural(rows.length, "Vorschlag", "Vorschläge"), SERIES_ID:"", SERIES_TITLE:"", RUN_ID:"", RUN_TEXT:"", CONFLICTS_TEXT:"", SERIES_LEVEL:"",
      SUGGESTIONS:rows, MERGE:charItems().map(c => ({M_ID:c.id, M_NAME:c.name}))}));
  } catch (e) { S.msg = e.code ? {kind:"err", html:esc(e.code === "not_granted" ? "Claude ist für diese App nicht freigegeben." : e.code === "rate_limited" ? "Dein Claude-Kontingent ist gerade ausgeschöpft. Bitte später noch einmal versuchen." : errText(e))} : {kind:"err", html:esc(errText(e))}; show("characters"); }
}
function setSecChars(text, ids){
  const m = /^---\n([\s\S]*?)\n---\n/.exec(text); if (!m) return text;
  let head = (m[1] + "\n").replace(/^characters:.*\n?/m, "").replace(/\n+$/, "");
  if (ids.length){ const line = "characters: [" + ids.join(", ") + "]"; head = /^approvals:/m.test(head) ? head.replace(/^approvals:/m, line + "\napprovals:") : head + "\n" + line; }
  return "---\n" + head + "\n---\n" + text.slice(m[0].length);
}
async function characterSuggestApply(d){

    const files = {}, orig = {"ghostwriter.yml":gy}, ids = {}, created = [], updated = [], texts = {};
    const text = async path => { if (!(path in texts)){ texts[path] = files[path] != null ? files[path] : (await getFile(path, work, true).catch(() => ({text:""}))).text; orig[path] = texts[path] || null; } return texts[path]; };

      const start = `---\nid: ${cid}\nname: ${yq(it.name)}\nrole: ${role}\nshort: ${yq(it.short || "")}\n---\n\n# ${it.name}\n\n## Beschreibung\n\n<Wer ist die Figur, was will sie, was fürchtet sie? Nur Arbeitsgrundlage, kommt nicht ins Buch.>\n\n## Notizen\n`;

/* Hinweisdurchsicht (#367): editorial/durchsicht-*.yml – Eintrag für Eintrag entscheiden, jede Antwort als kleiner Nachtrag */
const REVIEW_DECISIONS = ["ja", "nein", "geändert"], CH_STATUS = {planned:"geplant", in_progress:"in Arbeit", ready_for_assembly:"bereit zum Zusammenführen", assembly:"im Zusammenführen", review:"in Prüfung", ready_for_approval:"bereit zum Abschluss", approved:"abgeschlossen"};
const reviewKey = n => { const m = /^durchsicht-(.+?)(?:-(\d+))?\.yml$/.exec(n); return m ? [m[1], +(m[2] || 1)] : [n.replace(/\.yml$/, ""), 0]; };   // wie hinweise.dialog_order
const reviewCmp = (a, b) => { const x = reviewKey(a), y = reviewKey(b); return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : x[1] - y[1]; };
async function reviewFiles(){ return (await listDir("editorial", S.readRef)).filter(e => /^durchsicht-.+\.yml$/.test(e.name)).map(e => e.name).sort(reviewCmp); }
const reviewEntries = data => [...(data.ohne_autor || []).map(e => ["ohne_autor", e]), ...(data.autorenentscheidung || []).map(e => ["autorenentscheidung", e])];
const reviewState = e => e.umgesetzt ? "umgesetzt" : (e.entscheidung || "offen");
async function reviewLoad(file, fresh){
  const key = S.readRef + "|" + file, last = S.reviewText && S.reviewText[file];
  const text = (!fresh && last != null) ? last : (await getFile(file, S.readRef, true)).text;
  return {text, data:window.jsyaml.load(text) || {}};
}
const reviewWhere = e => e.chapter_id ? "Kapitel " + String(e.abschnitt).split(".")[0] : e.abschnitt;
async function reviewData(file){
  const {data} = await reviewLoad(file, true), all = reviewEntries(data), done = all.filter(([, e]) => (e.entscheidung || "offen") !== "offen").length;
  const [y, m, dd] = String(data.erstellt || "").split("-");
  const row = (e, author) => Object.assign({E_ID:e.id, E_WHERE:e.abschnitt, E_CHAPTER_TEXT:reviewWhere(e) + (e.chapter_status ? " · " + (CH_STATUS[e.chapter_status] || e.chapter_status) : ""), E_KIND:e.art || "",
    E_REASON:(e.schweregrad === "blockierend" ? "⛔ blockierend: " : "") + (e.grund || ""), E_CONTEXT:e.kontext || "", E_OLD:e.alt || "", E_NEW:e.neu || "", E_DECISION:reviewState(e)},
    author ? {E_QUESTION:(e.frage || "") + (e.varianten || []).map((v, k) => ` · Variante ${k + 1}: ${v}`).join("")} : {});
  const d = Object.assign(base(), {REVIEW_FILE:file, REVIEW_BOOK:data.buch || "", REVIEW_DATE_TEXT:dd ? `Stand ${dd}.${m}.${y}` : "", REVIEW_COUNT_TEXT:`${all.length} Einträge · ${done} entschieden · ${all.length - done} offen`});
  if ((data.ohne_autor || []).length) d.AUTO = data.ohne_autor.map(e => row(e, false));

async function reviewCard(){

      rows.push(`<li><div><b>${esc(f.replace(/^durchsicht-|\.yml$/g, ""))}</b> <span class="w">· ${done} von ${all.length} entschieden${all.length - done ? `, ${all.length - done} offen` : ""}</span></div><button class="btn" data-act="review" data-f="${esc("editorial/" + f)}">${all.length - done ? "Weitermachen" : "Ansehen"}</button></li>`); } catch (e) {}

function reviewSet(text, id, decision, neu){
  // nur die Zeilen dieses Eintrags ändern (Rest der Datei bleibt Zeichen für Zeichen), dann gegenprüfen
  const L = text.split("\n"), i = L.findIndex(l => l === "- id: " + id); if (i < 0) throw {message:`Eintrag ${id} nicht gefunden.`};
  let j = i + 1; while (j < L.length && (L[j].startsWith("  ") || L[j] === "")) j++;
  const blk = L.slice(i, j), setKey = (key, val) => {
    const dumped = window.jsyaml.dump({[key]:val}, {lineWidth:100}).replace(/\n$/, "").split("\n").map(l => "  " + l);
    const k = blk.findIndex(l => l.startsWith("  " + key + ":"));
    if (k >= 0){ let e = k + 1; while (e < blk.length && /^    /.test(blk[e])) e++; blk.splice(k, e - k, ...dumped); } else { let end = blk.length; while (end > 1 && blk[end - 1] === "") end--; blk.splice(end, 0, ...dumped); }
  };
  setKey("entscheidung", decision); if (neu != null) setKey("neu", neu);
  const out = [...L.slice(0, i), ...blk, ...L.slice(j)].join("\n");
  const a = window.jsyaml.load(text), b = window.jsyaml.load(out), ea = reviewEntries(a), eb = reviewEntries(b);
  const same = ea.length === eb.length && ea.every(([g, e], k) => eb[k][0] === g && (e.id === id ? true : JSON.stringify(e) === JSON.stringify(eb[k][1])));
  const t = eb.find(([, e]) => e.id === id);
  if (!same || !t || t[1].entscheidung !== decision || (neu != null && t[1].neu !== neu)) throw {message:"Die Durchsichtsdatei ließ sich nicht sicher ändern; bitte im Chat mit GhostWriter entscheiden."};
  return out;
}

async function reviewDecide(d){

/* Aufträge der Hintergrund-Warteschlange an einem Abschnitt (#476/#483), Zustände wie scripts/jobs.py */
function jobState(d){
  if (d.error) return "failed";
  if (d.waiting === "budget" && !d.confirm_low_budget) return "waiting_budget";
  return "open";
}
async function sectionJobs(x, work){
  const dir = `${x.c.path}/research/${x.s.id}`, out = [];
  for (const e of (await listDir(dir, work)).filter(e => /^request-\d+\.yml$/.test(e.name)).sort((a, b) => a.name.localeCompare(b.name))){
    let data = {}; try { data = window.jsyaml.load((await getFile(`${dir}/${e.name}`, work, true)).text) || {}; } catch (err) {}
    if ((data.type || "research") === "research") out.push({name:e.name.replace(/\.yml$/, ""), data, state:jobState(data)});
  }
  return out;
}
async function webCheck(id){
  const x = allSecs().find(v => v.s.id === id); if (!x) return;
  busy("Wird nachgesehen …");
  const work = workOf(S.book), dir = `${x.c.path}/research/${x.s.id}`;
  const jobs = await sectionJobs(x, work), names = jobs.map(j => j.name);
  const mine = S.webJobs[id] || [], gone = mine.filter(n => !names.includes(n));
  const again = `<button class="btn" data-act="webcheck" data-s="${esc(id)}"><i class="ti ti-refresh"></i> Nochmals nachsehen</button>`;
  // Fertig: Aufträge, die verschwunden sind, haben eine Laufdatei mit `request: <name>`
  const done = [];
  if (gone.length || !jobs.length){
    const runs = (await listDir(dir, work)).filter(e => /^run-\d+\.md$/.test(e.name)).sort((a, b) => b.name.localeCompare(a.name));
    for (const e of runs){
      if (gone.length && done.length >= gone.length) break;
      try { const t = (await getFile(`${dir}/${e.name}`, work, true)).text, h = front(t);
        if (gone.includes(h.request) || (!mine.length && h.web_research && !done.length)) done.push({name:e.name, head:h}); } catch (err) {}
      if (!mine.length && done.length) break;
    }
  }
  const lines = [], btns = new Set();
  for (const r of done){
    const h = r.head, cost = h.cost == null ? "Kosten ohne Preisangabe erfasst" : `Kosten etwa ${String(h.cost).replace(".", ",")}`;
    lines.push(`<b>Fertig:</b> ${esc(r.name)} mit ${h.sources || 0} Quellen aus ${h.searches || 0} Suchanfragen (${esc(cost)}). <button class="link" data-report="${esc(dir + "/" + r.name)}">Ansehen</button>`);
  }
  for (const j of jobs){
    if (j.state === "open") lines.push(`<b>Wartet bzw. läuft:</b> ${esc(j.name)}${j.data.confirm_low_budget ? " (trotz knappem Budget bestätigt)" : ""}.`);
    else if (j.state === "waiting_budget"){ lines.push(`<b>Wartet auf deine Bestätigung:</b> ${esc(j.name)} – das KI-Budget ist fast aufgebraucht.`); btns.add(`<button class="btn" data-act="webreslow" data-s="${esc(id)}">Trotzdem starten</button>`); }
    else {
      lines.push(`<b>Fehlgeschlagen:</b> ${esc(j.name)} – ${esc(j.data.error)}`);
      if (/KI-Budget/.test(j.data.error)) btns.add(`<button class="btn" data-act="webreslow" data-s="${esc(id)}">Trotzdem starten</button>`);
      btns.add(`<button class="btn" data-act="offres" data-s="${esc(id)}">Ohne Internet über Claude</button>`);
    }
  }
  const pending = jobs.some(j => j.state === "open"), missing = gone.length > done.length;
  if (done.length){ S.webJobs[id] = mine.filter(n => names.includes(n)); await loadBookData(work); }
  if (!lines.length) lines.push(missing ? "<b>Noch kein Ergebnis.</b>" : "<b>Keine Rechercheaufträge zu diesem Abschnitt.</b>");
  if (done.length) lines.push("Übernehmen kannst du Ergebnisse mit dem Änderungspaket in der Projektübersicht.");
  if (pending || missing) btns.add(again);
  const kind = jobs.some(j => j.state === "failed") ? "err" : done.length && !pending ? "ok" : "info";
  S.msg = {kind, html:lines.map(l => `<div>${l}</div>`).join("") + (btns.size ? `<div style="margin-top:8px">${[...btns].join(" ")}</div>` : "")};
  show("section", id);
}

function md(t){
  const lines = esc(t).split("\n"), out = []; let list = null;
  const inl = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  for (const l of lines){
    const li = /^\s*(?:[-*•]|\d+[.)])\s+(.*)/.exec(l);
    if (li){ if (!list){ list = /^\s*\d/.test(l) ? "ol" : "ul"; out.push(`<${list}>`); } out.push(`<li>${inl(li[1])}</li>`); continue; }
    if (list){ out.push(`</${list}>`); list = null; }
    if (/^#{1,6}\s/.test(l)) out.push(`<h4>${inl(l.replace(/^#+\s*/, ""))}</h4>`);
    else if (/^&gt;\s?/.test(l)) out.push(`<blockquote>${inl(l.replace(/^&gt;\s?/, ""))}</blockquote>`);
    else if (l.trim()) out.push(`<p>${inl(l)}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join("");
}
