# GhostWriter – Katalog möglicher KI-Anbieter
#
# Diese Liste ist eine Auswahlhilfe, keine Empfehlung und keine Garantie.
# Funktionen, Modelle, Preise und Datenschutzbedingungen ändern sich häufig.
# Vor dem Einsatz beim jeweiligen Anbieter prüfen und `checked_at` aktualisieren.
#
# Die IDs werden in ghostwriter.yml unter `ai_providers` verwendet.
# Modellnamen je Rolle stehen in ghostwriter.yml (`model`). Nur die Vorgaben, die
# GhostWriter selbst benutzt, wenn dort nichts steht, stehen unten unter `model_defaults`
# (#554): so genügt bei einer Abkündigung eine Änderung hier statt im Code.
#
# Felder:
#   kind:          llm | search_api | scholarly_index | coding_agent | platform | aggregator | local
#   access:        app (Chat-Oberfläche), api (Programmierschnittstelle), cli
#   web_research:  native (eingebaute Websuche), via_tool (über Werkzeug/Connector),
#                  none (keine), n/a (nicht anwendbar)
#   roles:         research | brainstorming | writing | revision | fact_check | queue_processing
#   hq:            Sitzland des Anbieters (Ländercode) – sagt nichts über Datenverarbeitungsort aus
#   api_key_secret: Vorschlag für den Namen des GitHub-Secrets, in dem der API-Schlüssel liegt
#                  (der Schlüssel selbst steht nie im Repository oder im Chat)
#   api_key_url:   optional: Seite des Anbieters, auf der man einen API-Schlüssel erstellt
#   api_key_alt:   optional: alternatives Secret (z. B. Abo-Token statt API-Schlüssel)
#   chat_widgets:  optional: true = die Chat-Oberfläche des Anbieters stellt GhostWriter-Widgets dar
#                  (eingebettetes HTML mit Skript, siehe templates/ui/BEFUELLUNG.md, „Darstellungsmodus“);
#                  fehlt bzw. false = dort nur Text
#   setup:         optional: eigene GhostWriter-Anleitung (Pfad im Repository, ggf. mit #Anker);
#                  ohne setup verlinkt das Formular „KI-Dienste“ den passenden Weg in
#                  docs/DIENSTE-NUTZEN.md (nach kind/access) und zusätzlich die Website `url`

version: "1.0"
checked_at: "2026-10-31"

# Vorgabemodelle je Anbieter und Aufgabe (#554). `checked_at` = Datum der letzten Prüfung beim Anbieter (öffentliche Abkündigungsseiten,
# #596). Optional: `retire_at` = vom Anbieter angekündigte Abschaltung (die Prüfung warnt 90 Tage vorher), `note` = Hinweis.
# Ein Buch überschreibt sie in den Einstellungen (ai_providers.services.<id>.model). Aufgaben:
# research (Recherche in der Action), image (Colorieren). Wer ein Modell hier ändert, setzt `checked_at` neu.
# `python3 scripts/model_defaults.py check` vergleicht die Modelle mit den kostenlosen Listen der Anbieter.
model_defaults:
  anthropic:
    research: {model: claude-sonnet-5-5, checked_at: "2026-11-25"}   # öffentliche Abkündigungsseite: als Ersatz genannt, keine Abschaltung angekündigt
  openai:
    research: {model: gpt-6.1-terra, checked_at: "2026-11-26"}   # Entscheidung Peter 25.11.2026 (#638): Ersatz für gpt-5 (Abschaltung 2026-12-11), günstiger als die empfohlene Stufe gpt-6.1-sol
  perplexity:
    research: {model: perplexity/sonar, checked_at: "2026-11-26", note: "Agent API (POST /v1/agent); Sonar über Chat Completions endete am 2026-09-27"}
  xai:
    research: {model: grok-4.3, checked_at: "2026-11-26"}
  openrouter:
    research: {model: openai/gpt-5.6-luna, checked_at: "2026-11-26"}
  google:
    research: {model: gemini-3.8-flash, checked_at: "2026-11-25"}   # öffentliche Abkündigungsseite: als Ersatz für 3.5 bis 3.7 genannt
    # Abschaltung frühestens 2027-03-15 (ältere Fassung der Seite nannte 2026-10-02); Ersatz laut Anbieter gemini-3.1-flash-lite-image.
    image: {model: gemini-2.5-flash-image, checked_at: "2026-11-25", retire_at: "2027-03-15", note: "Ersatz laut Anbieter gemini-3.1-flash-lite-image; nicht umgestellt, ohne Schlüssel nicht getestet"}

# Preistabelle (#66): Preise je Anbieter und Modell für die automatische Kostenschätzung („geschätzt“) aus der Nutzung
# jeder Antwort (Tokens, Suchanfragen). Je Eintrag: `currency`, `input_per_mtok` und `output_per_mtok` (je 1 Mio. Tokens),
# optional `search_per_1k` (je 1000 Suchanfragen), `source` (Seite des Anbieters) und `checked_at` (Prüfdatum). Ein Modell
# ohne Eintrag bleibt „unbekannt“, nie 0; nichts aus dem Gedächtnis eintragen, nur von der Anbieterseite. Rechnungen bleiben
# „tatsächlich“ von Hand (`costs.py add`). Tarife wie Batch, Flex oder Cache-Preise sind hier nicht abgebildet (Standardpreis).
# Beim Ändern `checked_at` neu setzen. Umrechnung in die Projektwährung: ECB-Referenzkurs des Tages (`scripts/pricing.py`).
prices:
  anthropic:
    claude-sonnet-5-5: {currency: USD, input_per_mtok: 2, output_per_mtok: 10, search_per_1k: 10, source: "https://platform.claude.com/docs/en/about-claude/pricing", checked_at: "2026-11-26"}
    claude-opus-5-5: {currency: USD, input_per_mtok: 4, output_per_mtok: 20, search_per_1k: 10, source: "https://platform.claude.com/docs/en/about-claude/pricing", checked_at: "2026-11-26"}
  openai:
    # Standardpreise laut Preisseite. gpt-6.1-terra steht dort nur im Flex-Tarif, nicht im Standardtarif: bewusst ohne Eintrag,
    # bis der Preis feststeht (offene Frage an Peter an #66).
    gpt-6.1-sol: {currency: USD, input_per_mtok: 2, output_per_mtok: 10, search_per_1k: 10, source: "https://developers.openai.com/api/docs/pricing", checked_at: "2026-11-26"}
  # google: Preisseite war bei der Prüfung nicht erreichbar; bewusst ohne Einträge (Beträge bleiben „unbekannt“).
  # Teil 2 von #462 (26.11.2026, auf den Anbieterseiten gegengeprüft). Perplexity: Agent API, web_search 0,0025 $ je Aufruf; xAI: web_search 5 $ je 1.000 Aufrufe;
  # OpenRouter: Modellpreise laut Modellliste, Websuche über Exa 0,007 $ je Anfrage (Standard-Engine; andere Engines kosten anders, dann weicht die Schätzung ab).
  perplexity:
    perplexity/sonar: {currency: USD, input_per_mtok: 0.25, output_per_mtok: 2.5, search_per_1k: 2.5, source: "https://docs.perplexity.ai/docs/getting-started/pricing.md", checked_at: "2026-11-26"}
  xai:
    grok-4.3: {currency: USD, input_per_mtok: 1.25, output_per_mtok: 2.5, search_per_1k: 5, source: "https://docs.x.ai/developers/pricing.md", checked_at: "2026-11-26"}
  openrouter:
    openai/gpt-5.6-luna: {currency: USD, input_per_mtok: 0.2, output_per_mtok: 1.2, search_per_1k: 7, source: "https://openrouter.ai/docs/guides/features/server-tools/web-search", checked_at: "2026-11-26"}

# Sonderwert: der Assistent, mit dem gerade gechattet wird (egal welcher Anbieter).
special:
  - id: chat
    name: Aktueller Chat-Assistent
    note: Verwendet den Assistenten der laufenden Sitzung. Standard für die In-Chat-Version.

# Bilddienste für die Übergabe von Referenzbildern (#143, Punkte 5 und 6; scripts/image_service.py).
# `via_action`: GhostWriter spricht den Dienst selbst an (Action „Bild erzeugen“) und kann die Bildbytes übergeben;
# sonst bleibt die Übergabe beim Chat-Programm und GhostWriter meldet das ausdrücklich. `references`: Fähigkeit des Dienstes
# (supported, Höchstzahl, Formate, Größe je Bild in Bytes). `checked_at` = Datum der Prüfung beim Anbieter.
image_services:
  - id: google
    name: Google Gemini (Bildmodell)
    via_action: true
    api_key_secret: GEMINI_API_KEY
    references: {supported: true, max: 3, formats: [png, jpeg], max_bytes: 7340032}   # Anbieter: bis zu 3 Bilder je Anfrage, 7 MB je Bild inline
    checked_at: "2026-11-25"
  - id: openai
    name: OpenAI (Bildmodell)
    via_action: false
    note: "GhostWriter hat für diesen Dienst noch keinen Aufruf; im Chat übergibt das Chat-Programm Bilder selbst."
    references: {supported: false}
    checked_at: "2026-11-25"
  - id: chat
    name: Bilddienst im Chat (andere Dienste, z. B. über einen Connector)
    via_action: false
    note: "Ob der Dienst Bildreferenzen annimmt, entscheidet das Chat-Programm; GhostWriter sieht die Übergabe nicht."
    references: {supported: false}
    checked_at: "2026-11-25"

providers:
  # --- Große Sprachmodell-Anbieter (Recherche, Brainstorming, Schreiben, Revision, Fact-Check) ---
  - id: openai
    name: OpenAI (ChatGPT / OpenAI API)
    kind: llm
    hq: US
    access: [app, api]
    web_research: native
    roles: [research, brainstorming, writing, revision, fact_check, queue_processing]
    queue_agents: [openai_codex]
    url: https://openai.com
    api_key_secret: OPENAI_API_KEY
    api_key_url: https://platform.openai.com/api-keys
    setup: docs/CONNECTOR-SETUP.md#teil-4-optional-in-chatgpt-einrichten

  - id: anthropic
    name: Anthropic (Claude / Claude API)
    kind: llm
    hq: US
    access: [app, api]
    web_research: native
    roles: [research, brainstorming, writing, revision, fact_check, queue_processing]
    queue_agents: [claude_code]
    chat_widgets: true
    url: https://www.anthropic.com
    api_key_secret: ANTHROPIC_API_KEY
    api_key_url: https://console.anthropic.com/settings/keys
    setup: docs/CONNECTOR-SETUP.md

  - id: google
    name: Google (Gemini / Gemini API)
    kind: llm
    hq: US
    access: [app, api]
    web_research: native
    note: Websuche als „Grounding with Google Search“.
    roles: [research, brainstorming, writing, revision, fact_check, queue_processing]
    queue_agents: [google_jules, gemini_cli]
    url: https://ai.google.dev
    api_key_secret: GEMINI_API_KEY
    api_key_url: https://aistudio.google.com/apikey

  - id: mistral
    name: Mistral AI (Le Chat / Mistral API)
    kind: llm
    hq: FR
    access: [app, api]
    web_research: via_tool
    note: Europäischer Anbieter; Websuche über Agents API / Connector.
    roles: [research, brainstorming, writing, revision, fact_check]
    url: https://mistral.ai
    api_key_secret: MISTRAL_API_KEY
    api_key_url: https://console.mistral.ai/api-keys

  - id: xai
    name: xAI (Grok / xAI API)
    kind: llm
    hq: US
    access: [app, api]
    web_research: native
    roles: [research, brainstorming, writing, revision, fact_check]
    url: https://x.ai
    api_key_secret: XAI_API_KEY
    api_key_url: https://console.x.ai

  - id: perplexity
    name: Perplexity (App / Agent API)
    kind: llm
    hq: US
    access: [app, api]
    web_research: native
    note: Auf quellenbasierte Recherche spezialisiert; für Langtexte weniger geeignet.
    roles: [research, fact_check]
    url: https://www.perplexity.ai
    api_key_secret: PERPLEXITY_API_KEY
    api_key_url: https://www.perplexity.ai/settings/api

  - id: microsoft_copilot
    name: Microsoft Copilot
    kind: llm
    hq: US
    access: [app]
    web_research: native
    roles: [research, brainstorming, writing, revision]
    url: https://copilot.microsoft.com

  - id: cohere
    name: Cohere (Command / Cohere API)
    kind: llm
    hq: CA
    access: [api]
    web_research: via_tool
    note: Stark auf Retrieval/RAG mit eigenen Dokumenten ausgerichtet.
    roles: [research, revision, fact_check]
    url: https://cohere.com
    api_key_secret: COHERE_API_KEY
    api_key_url: https://dashboard.cohere.com/api-keys

  - id: deepseek
    name: DeepSeek
    kind: llm
    hq: CN
    access: [app, api]
    web_research: via_tool
    note: Datenschutz und Verarbeitungsort vor Einsatz besonders prüfen.
    roles: [brainstorming, writing, revision]
    url: https://www.deepseek.com
    api_key_secret: DEEPSEEK_API_KEY
    api_key_url: https://platform.deepseek.com/api_keys

  - id: qwen
    name: Alibaba Qwen
    kind: llm
    hq: CN
    access: [app, api]
    web_research: via_tool
    note: Auch als offene Modellgewichte verfügbar (lokal oder über Plattformen nutzbar).
    roles: [brainstorming, writing, revision]
    url: https://qwen.ai
    api_key_secret: DASHSCOPE_API_KEY

  - id: moonshot
    name: Moonshot AI (Kimi)
    kind: llm
    hq: CN
    access: [app, api]
    web_research: via_tool
    roles: [brainstorming, writing, revision]
    url: https://www.moonshot.ai
    api_key_secret: MOONSHOT_API_KEY

  - id: meta_llama
    name: Meta Llama (offene Modelle)
    kind: llm
    hq: US
    access: [api]
    web_research: none
    note: Keine eigene Schreib-App; Nutzung über Plattformen, Aggregatoren oder lokal.
    roles: [brainstorming, writing, revision]
    url: https://www.llama.com

  # --- Plattformen und Aggregatoren (Zugang zu mehreren Modellen über eine Schnittstelle) ---
  - id: openrouter
    name: OpenRouter
    kind: aggregator
    hq: US
    access: [api]
    web_research: via_tool
    note: Ein API-Schlüssel für viele Modelle; Anbieter/Modell dann in `model` angeben.
    roles: [research, brainstorming, writing, revision, fact_check]
    url: https://openrouter.ai
    api_key_secret: OPENROUTER_API_KEY
    api_key_url: https://openrouter.ai/keys

  - id: aws_bedrock
    name: Amazon Bedrock
    kind: platform
    hq: US
    access: [api]
    web_research: via_tool
    note: Modelle mehrerer Anbieter; Rechenzentrumsregion wählbar.
    roles: [brainstorming, writing, revision, fact_check]
    url: https://aws.amazon.com/bedrock

  - id: azure_ai_foundry
    name: Microsoft Azure AI Foundry
    kind: platform
    hq: US
    access: [api]
    web_research: via_tool
    note: Modelle mehrerer Anbieter; Rechenzentrumsregion wählbar.
    roles: [brainstorming, writing, revision, fact_check]
    url: https://azure.microsoft.com/products/ai-foundry

  - id: google_vertex
    name: Google Cloud Vertex AI
    kind: platform
    hq: US
    access: [api]
    web_research: via_tool
    note: Gemini und weitere Modelle; Rechenzentrumsregion wählbar.
    roles: [research, brainstorming, writing, revision, fact_check]
    url: https://cloud.google.com/vertex-ai

  # --- Lokal (keine Cloud, keine laufenden Kosten, keine eingebaute Websuche) ---
  - id: local_ollama
    name: Ollama (lokal)
    kind: local
    hq: n/a
    access: [api, cli]
    web_research: none
    note: Offene Modelle auf eigenem Rechner; Qualität hängt von Modell und Hardware ab.
    roles: [brainstorming, writing, revision]
    url: https://ollama.com

  - id: local_lmstudio
    name: LM Studio (lokal)
    kind: local
    hq: n/a
    access: [app, api]
    web_research: none
    roles: [brainstorming, writing, revision]
    url: https://lmstudio.ai

# Ergänzende Recherchequellen: liefern Suchtreffer/Quellen, schreiben aber keine Texte.
# Werden in ghostwriter.yml unter ai_providers.research.search_tools eingetragen.
search_tools:
  - id: brave_search
    name: Brave Search API
    kind: search_api
    note: Eigener, von Google unabhängiger Index.
    url: https://brave.com/search/api
    api_key_secret: BRAVE_API_KEY
    api_key_url: https://api-dashboard.search.brave.com/app/keys
  - id: tavily
    name: Tavily
    kind: search_api
    note: Für KI-Agenten entwickelte Such-API. Vorgesehener Standard-Suchdienst (Entscheidung Peter 26.11.2026), noch nicht angebunden.
    url: https://tavily.com
    api_key_secret: TAVILY_API_KEY
    api_key_url: https://app.tavily.com
  - id: exa
    name: Exa
    kind: search_api
    note: Semantische Suche, „ähnliche Seiten finden“.
    url: https://exa.ai
    api_key_secret: EXA_API_KEY
    api_key_url: https://dashboard.exa.ai/api-keys
  - id: parallel
    name: Parallel
    kind: search_api
    note: Liefert für LLMs aufbereitete Auszüge.
    url: https://parallel.ai
    api_key_secret: PARALLEL_API_KEY
  - id: perplexity_sonar
    name: Perplexity Sonar API
    kind: search_api
    note: Suche mit zusammengefasster, belegter Antwort.
    url: https://docs.perplexity.ai
    api_key_secret: PERPLEXITY_API_KEY
    api_key_url: https://www.perplexity.ai/settings/api
  - id: serpapi
    name: SerpAPI
    kind: search_api
    note: Ergebnisse klassischer Suchmaschinen inkl. Google Scholar.
    url: https://serpapi.com
    api_key_secret: SERPAPI_API_KEY
    api_key_url: https://serpapi.com/manage-api-key
  - id: semantic_scholar
    name: Semantic Scholar API
    kind: scholarly_index
    note: Wissenschaftliche Literatur, kostenlos nutzbar.
    url: https://www.semanticscholar.org/product/api
    api_key_secret: SEMANTIC_SCHOLAR_API_KEY
    api_key_url: https://www.semanticscholar.org/product/api#api-key-form
  - id: openalex
    name: OpenAlex
    kind: scholarly_index
    note: Offener Katalog wissenschaftlicher Publikationen, kostenlos.
    url: https://openalex.org

# Agenten für die Queue-Bearbeitung (GitHub-Issues abarbeiten, Pull Requests erstellen).
# Nur hier ist relevant, welcher Chat-/Agent-Anbieter technisch mit dem Repository arbeitet.
queue_agents:
  - id: github_copilot_agent
    name: GitHub Copilot Coding Agent
    provider: microsoft_copilot
    note: Issue in GitHub zuweisen; erstellt ein Änderungspaket.
    url: https://docs.github.com/copilot
  - id: openai_codex
    name: OpenAI Codex
    provider: openai
    note: Auch als Partner-Agent direkt in GitHub zuweisbar (je nach Copilot-Plan).
    url: https://openai.com/codex
    api_key_secret: OPENAI_API_KEY
    api_key_url: https://platform.openai.com/api-keys
  - id: claude_code
    name: Claude Code
    provider: anthropic
    note: Auch als Partner-Agent direkt in GitHub zuweisbar (je nach Copilot-Plan).
    url: https://claude.com/claude-code
    api_key_secret: ANTHROPIC_API_KEY
    api_key_url: https://console.anthropic.com/settings/keys
    api_key_alt: CLAUDE_CODE_OAUTH_TOKEN   # statt API-Schlüssel: Token aus dem Pro/Max-Abo (`claude setup-token`)
  - id: google_jules
    name: Google Jules
    provider: google
    note: Asynchroner Agent, arbeitet mit GitHub-Repositories.
    url: https://jules.google
  - id: gemini_cli
    name: Gemini CLI
    provider: google
    note: Kommandozeilen-Agent, z. B. in GitHub Actions einsetzbar.
    url: https://github.com/google-gemini/gemini-cli
    api_key_secret: GEMINI_API_KEY
    api_key_url: https://aistudio.google.com/apikey
  - id: manual
    name: Manuell im Chat
    provider: chat
    note: Keine automatische Abarbeitung; der Benutzer bearbeitet Issues gemeinsam mit dem Chat-Assistenten.
