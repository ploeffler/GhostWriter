version: "1.0"
id: ghostwriter-book-workflow
language: de

product_roadmap:
  current_target: "v0.6"   # Programmversion siehe ghostwriter-manifest.yml; Abnahme v0.6 in #41
  v0_5:
    purpose: usable_basics
    scope: [project_create_and_setup, chapter_create_and_setup, chapter_and_section_editing, book_edition_create, book_export_pdf_docx_epub, ai_runs_immediate_in_chat]
    exclusions: [ai_runs_scheduled_queue, full_end_to_end_workflow_automation, advanced_issue_and_milestone_orchestration, complete_fact_checking_automation]
  v0_5_steps:
    operating_path: chat_with_github_connection   # Weg A
    later_path_considered: own_api_and_mcp        # Weg B, erst nach v1.0
    tracking: github_milestones_and_issues
    steps:
      - {version: "v0.1", goal: data_model_defined_and_validated}
      - {version: "v0.2", goal: read_and_display_test_project}
      - {version: "v0.3", goal: set_up_and_edit_project_and_chapters}
      - {version: "v0.4", goal: immediate_ai_runs_with_costs}
      - {version: "v0.5", goal: edition_and_export}
      - {version: "v0.6", goal: library_one_installation_many_books_as_branches}   # #36–#41, Migration #59, README #46, öffentliches Programm-Repo #48
      - {version: "v0.7", goal: characters_and_image_generation}                  # Figuren #53, Bilderzeugung #54
      - {version: "v1.0", goal: complete_book_workflow_without_ai_provider_apis}                           # siehe v1_0
      - {version: "v1.1", goal: external_docx_checkout_and_roundtrip}             # #209, D17
      - {version: "v1.5", goal: foreword_afterword_glossary_and_book_translation}   # #58, #75
  v1_0:
    purpose: complete_book_workflow_without_ai_provider_apis
    scope: chat_and_manual_handoff_without_ai_provider_connections
    requires: [github_issue_and_milestone_orchestration, robust_approval_and_audit_controls, repeatable_research_and_fact_checking, complete_export_and_release_pipeline, workflow_validation_and_quality_gates, usage_limits_pause_automation, front_and_back_matter, output_options, program_i18n, book_ai_disclosure, cross_client_state_sync, external_image_research, reference_images_manual_handoff, reviewed_chat_analysis_results, existing_prompt_profiler]
    approved_decisions: docs/ENTSCHEIDUNGEN-v1.0.md
    implementation_orders: docs/AUFTRAEGE-v1.0.md
    supported_clients: [chatgpt, codex, claude, openwebui]
    display_changes_require_all_client_checks: true
    # Entscheidung 08.11.2026: keine KI-Anbieter-API-Verbindungen bis einschließlich v1.0.
    exclusions: [own_backend_api, installable_web_app_pwa, offline_book_repository, prompt_compiler, automatic_prompt_shortening, external_docx_roundtrip, ai_provider_api_connections, scheduled_provider_ai_runs, provider_usage_import, provider_quota_queries, direct_image_provider_calls, automatic_reference_image_delivery]
    deferred_until_after_v1_0: [own_service_19, web_app_35, offline_web_app_61, provider_parts_of_54_143_65_66_62_71_35_75_204, real_provider_api_acceptance_for_123_124, prompt_compiler_204]
    ai_execution: chat_or_copy_order_and_review_returned_results
    acceptance_requires_provider_credentials: false
    # #19/#35/#61 erst nach v1.0, #209 ausdrücklich v1.1 (D01/D06/D17).
    #   Anbieterabhängige Teile von #65/#66 erst nach v1.0 (Entscheidung oben).
    #   cross_client_state_sync #179 (prioritärer Stabilitätsauftrag; zunächst Planung),
    #   usage_limits_pause_automation #62, front_and_back_matter #57, output_options #68, program_i18n #74, book_ai_disclosure #78
  delivery_policy:
    incremental_delivery: true
    v0_5_must_be_useful_without_v1_0_features: true
    do_not_block_basic_book_work_on_advanced_automation: true

session_backup:
  commands:
    save: [Session sichern, Chat sichern, Chat speichern]
    load: [Session laden]
    accept: [Session übernehmen]
  storage: conversations/<session-id>/
  branch: ghostwriter/chat/<session-id>
  commit_policy: one_per_changed_coherent_topic
  pull_request_policy: one_per_session
  auto_merge_on_save: false
  auto_save_trigger: section_dialogue_completed
  auto_save_requires: [no_awaiting_reply, all_discussed_items_answered_decided_or_explicitly_deferred, message_evidence]
  accept_steps: [validate, diagnose_failure, attempt_safe_technical_repair, revalidate, merge]
  content_approval_granted: false
  manuscript_changes_allowed: false
  instructions: docs/SESSION-SICHERUNG.md

book_releases:
  purpose: versioned_book_editions
  platform: github_releases
  name_pattern: "{title_short} – Auflage {edition}"
  tag_pattern: "{title_short_slug}-auflage-{edition}"
  edition_numbering: integer_starting_at_1
  new_edition_trigger: explicit_user_request
  corrections_between_editions: collected_in_repository_until_next_edition
  immutable_snapshot: true
  release_must_reference_commit: true
  release_notes_required: true
  assets: [pdf, epub, docx]
  approval:
    explicit_user_approval_required: true
    only_approved_manuscript_content_may_be_released: true
  distinction:
    product_milestones_are_not_book_releases: true
    github_software_tags_are_not_book_edition_tags: true
cost_tracking:
  enabled: true
  purpose: transparent_ai_activity_cost_accounting
  # Erfasst werden zusätzliche, verbrauchsabhängige KI-API-Kosten aus GhostWriter-Backend-Aufrufen
  # (backend_api) und KI-Aufrufen aus GitHub Actions (action_api). Chat-Arbeit über bestehende
  # Abos erzeugt keinen Kosteneintrag und keine Schätzung.
  scope:
    records: [backend_ai_api_calls, action_ai_api_calls]
    excludes: [chat_work_via_subscription, administrative_backend_requests, ghostwriter_hosting_and_operating_costs, chat_subscription_fees]
    run_history_separate: true
  project_currency: EUR
  currency_is_configurable: true
  attribution:
    primary_unit: section
    section_id_required: for_section_activity_only
    project_level_activity_may_omit_section_id: true
    chapter_total: sum_of_assigned_section_costs
    project_total: sum_of_all_chapter_totals_and_project_level_costs
    allow_project_level_costs: true
    prevent_double_counting: true
  activity_record:
    immutable: true
    one_record_per_ai_activity: true
    required_fields: [activity_id, occurred_at, source, provider, model, activity_type, currency, cost_amount, cost_status]
    source_values: [backend_api, action_api, legacy_chat_estimate]   # action_api zählt; legacy_chat_estimate zählt nicht mit
    provenance_fields: [run_id, request_id, synthetic]
    optional_usage_fields: [input_tokens, output_tokens, cached_input_tokens, reasoning_tokens, image_units, audio_units, other_usage_quantity]
    pricing_fields: [pricing_basis, input_unit_price, output_unit_price, cached_input_unit_price, pricing_source, pricing_checked_at]
    cost_status_values: [actual, estimated, manually_entered, unavailable]
    preserve_original_currency_and_amount: true
    conversion:
      allowed: true
      require_exchange_rate_and_date: true
  storage:
    format: yaml
    section_ledger_path: "chapters/{chapter_id}/costs/{section_id}.yml"
    project_ledger_path: "costs/project.yml"
    one_file_per_section: true
    append_only: true
  aggregation:
    section_subtotal: sum_of_activity_records_for_section
    chapter_subtotal: sum_of_section_subtotals
    project_total: sum_of_chapter_subtotals_and_project_level_costs
    show_currency: true
    show_actual_and_estimated_separately: true
    show_usage_and_cost_breakdown: true
    refresh_after_each_record: true
  v0_5:
    scope: basic_cost_tracking
    includes: [backend_api_cost_entry, optional_token_and_usage_entry, section_attribution, chapter_subtotals, project_total, actual_vs_estimated_label]
    cost_display_optional: true   # Kostenanzeigen sind keine Voraussetzung für Chat-Arbeit
  v1_0:
    scope: cost_transparency_without_provider_connections
    includes: [existing_cost_records, actual_vs_estimated_label, unavailable_values_explicit, budget_thresholds_from_available_records]
    # Automatischer Provider-Nutzungsimport und Anbieter-Kontingente erst nach v1.0.
  invariants:
    - every_billable_backend_or_action_ai_api_call_must_be_recorded_or_marked_unavailable
    - chat_work_via_subscription_creates_no_cost_entry
    - legacy_chat_estimates_are_not_counted
    - every_section_activity_must_reference_a_stable_section_id
    - project_level_activity_may_omit_section_id
    - backend_and_action_ai_api_calls_are_counted
    - chat_work_via_subscription_creates_no_cost_entry
    - chapter_and_project_totals_are_derived_not_manually_duplicated
    - estimated_costs_must_never_be_presented_as_actual_costs
    - retain_usage_and_price_basis_for_auditing
    - historical_records_are_never_silently_overwritten
    - no_double_counting_across_section_chapter_and_project_totals

authority:
  source_of_truth: workflow.yml
  project_metadata: ghostwriter.yml
  manuscript_and_history: git
  approvals_require_explicit_user_confirmation: true
  automation_must_not_infer_approval: true

global_ai_policy:
  hallucination_policy: strict
  source_policy: required
  uncertainty_policy: explicit
  creativity: balanced
  web_research: research
  override_policy: stricter_freely_looser_with_confirmation   # #300: Lockern nur mit Bestätigung (approvals.yml, kind: rules), Untergrenzen in scripts/rules.py

provider_selection:
  purpose: selectable_ai_provider_per_role
  config_source: ghostwriter.yml#ai_providers
  catalog: providers.yml
  roles: [research, brainstorming, writing, revision, fact_check, queue_processing]
  fallback_role: default
  special_provider_ids: [chat]
  queue_processing_uses: queue_agents
  record_provider_and_model_per_run: true
  invariants:
    - global_ai_policy_applies_to_every_provider
    - provider_change_never_relaxes_quality_rules
    - research_role_requires_web_research_or_explicit_uncertainty_label
    - unavailable_provider_must_be_reported_not_silently_replaced
    - provider_and_model_recorded_in_every_run_and_cost_record

entities:
  chapter:
    id_pattern: "^ch-[a-z0-9][a-z0-9-]*$"
    stable_id: true
    visible_number: derived_from_order
    min_sections: 1
    statuses: [planned, in_progress, ready_for_assembly, assembly, review, ready_for_approval, approved]
  section:
    id_pattern: "^sec-[a-z0-9][a-z0-9-]*$"
    stable_id: true
    visible_number: derived_from_order
    statuses: [planned, research, brainstorming, ready_to_write, writing, revision, fact_check, ready_for_approval, approved]
    fact_check: [disabled, optional, requested]

runs:
  catch_up:
    commands: [einpflegen, nachziehen]
    repeatable: true
    immutable: true
    execution: assistant_in_chat
    instructions: docs/NACHZIEHEN.md
    context_command: scripts/catch_up.py
    scopes: [chapter, book]
    path: "analysis/catch-up/run-{sequence}.md"
    required_fields: [inputs, provider, model, source_version, section_coverage, findings, sources, change_plan, changes, open_questions, editorial_result]
    requires_all_sections_in_scope: true
    requires_research_for_unverified_claims: true
    requires_existing_writing_approval_for_manuscript_changes: true
    requires_editorial_review_after_changes: true
    grants_approval: false
  research:
    repeatable: true
    immutable: true
    path: "chapters/{chapter_id}/research/{section_id}/run-{sequence}.md"
    required_fields: [run_id, created_at, provider, model, research_question, scope, sources, findings, uncertainties, contradictions, open_questions]
  chapter_research:
    # Recherche für ein ganzes Kapitel (Formular „Kapitelrecherche“); liefert Vorschläge für Ziel und Kurzbeschreibung
    repeatable: true
    immutable: true
    path: "chapters/{chapter_id}/research/kapitel/run-{sequence}.md"
    required_fields: [run_id, created_at, provider, model, research_question, scope, task, weight_prev, weight_next, context, sources, findings, uncertainties, open_questions, suggested_goal, suggested_summary]
    neighbour_weights: {0: ignore, 1: delimit, 2: connect, 3: derive}   # vorheriges/nächstes Kapitel; nie Manuskripttext
    tasks: [goal, sections, summary]   # höchstens eine; ohne Aufgabe nur die Fragestellung
    sections_proposal: add_only_at_end_after_user_selection   # vorhandene Abschnitte nie ändern, verschieben oder löschen
    may_modify_chapter: false
  brainstorming:
    repeatable: true
    immutable: true
    path: "chapters/{chapter_id}/brainstorming/{section_id}/run-{sequence}.md"
    required_fields: [run_id, created_at, provider, model, objective, ideas, argument_lines, examples, open_questions, selected_results]
  writing:
    # Protokoll eines Ghostwriting-Laufs; der Text selbst steht im Manuskript der Abschnittsdatei
    repeatable: true
    immutable: true
    path: "chapters/{chapter_id}/writing/{section_id}/run-{sequence}.md"
    required_fields: [run_id, created_at, provider, model, mode, based_on, result]
    requires: [writing_approval]
  illustration:
    # Bildauftrag (#54): Prompt, Dienst, Herkunft, Varianten, Auswahl; das Bild liegt daneben (img-….png/.jpg + .yml)
    repeatable: true
    immutable: true
    path: "chapters/{chapter_id}/images/{section_id}/run-{sequence}.md"
    required_fields: [run_id, created_at, provider, model, source, prompt, characters, variants, selected]
    may_modify_manuscript: false
  analysis:
    # Analyse im Hintergrund (#123, scripts/analyze.py): Vorschläge, nie Änderungen am Buch; daneben run-NNN.json
    repeatable: true
    immutable: true
    path: "analysis/{kind}/run-{sequence}.md"
    required_fields: [id, type, kind, scope, created_at, provider, model, merge_model, blocks_analysed, blocks_cached, suggestions, dropped_without_evidence, input_tokens, output_tokens, cost, result]
    may_modify_manuscript: false
  fact_check:
    repeatable: true
    immutable: true
    path: "chapters/{chapter_id}/fact-check/{section_id}/run-{sequence}.md"
    required_fields: [run_id, created_at, provider, model, confirmed_claims, insufficiently_supported_claims, contradictory_claims, potentially_false_claims, proposed_corrections]
    may_modify_manuscript: false

section_workflow:
  initial_status: planned
  transitions:
    - from: planned
      to: research
      trigger: start_research
    - from: research
      to: brainstorming
      trigger: research_sufficient_and_user_continues
    - from: brainstorming
      to: ready_to_write
      trigger: findings_consolidated
    - from: ready_to_write
      to: writing
      trigger: explicit_user_writing_approval
      requires: [research_run_exists, brainstorming_run_exists, outline_present, user_approval_record]
    - from: writing
      to: revision
      trigger: draft_created
    - from: revision
      to: fact_check
      trigger: user_requests_fact_check
      optional: true
    - from: revision
      to: ready_for_approval
      trigger: revision_complete_or_fact_check_skipped
    - from: fact_check
      to: revision
      trigger: corrections_discussed
    - from: ready_for_approval
      to: approved
      trigger: explicit_user_section_approval
      requires: [manuscript_version, manuscript_content_sha256, user_approval_record]
    - from: approved
      to: revision
      trigger: explicit_user_section_approval_revocation
      requires: [explicit_user_confirmation, append_only_revocation_record]
    - from: approved
      to: revision
      trigger: confirmed_structure_change_invalidates_section_approval
      requires: [explicit_user_confirmation, append_only_revocation_record]
  invariants:
    - research_and_brainstorming_are_repeatable
    - prior_runs_are_never_overwritten
    - no_draft_before_writing_approval_unless_confirmed_quick_level   # #300: Stufe „Zügig“ (rules.approvals: quick)
    - fact_check_never_silently_changes_manuscript
    - approved_requires_explicit_user_confirmation
    - approved_manuscript_is_immutable_until_section_approval_is_revoked
    - approval_must_bind_to_exact_manuscript_content_sha256
    - section_approval_revocation_requires_explicit_user_confirmation

chapter_workflow:
  initial_status: planned
  transitions:
    - from: planned
      to: in_progress
      trigger: first_section_work_starts
    - from: in_progress
      to: ready_for_assembly
      trigger: all_sections_approved
      requires: [all_sections_status_approved]
    - from: ready_for_assembly
      to: assembly
      trigger: assemble_chapter
    - from: assembly
      to: review
      trigger: assembled_chapter_created
    - from: review
      to: ready_for_approval
      trigger: chapter_review_complete
    - from: ready_for_approval
      to: approved
      trigger: explicit_user_chapter_approval
      requires: [all_sections_status_approved, assembled_chapter_version, user_approval_record]
    - from: ready_for_assembly
      to: in_progress
      trigger: structure_change_invalidates_chapter
      requires: [affected_chapter_status_reset, append_only_revocation_record_if_previously_approved]
    - from: assembly
      to: in_progress
      trigger: structure_change_invalidates_chapter
      requires: [affected_chapter_status_reset, append_only_revocation_record_if_previously_approved]
    - from: review
      to: in_progress
      trigger: structure_change_invalidates_chapter
      requires: [affected_chapter_status_reset, append_only_revocation_record_if_previously_approved]
    - from: ready_for_approval
      to: in_progress
      trigger: structure_change_invalidates_chapter
      requires: [affected_chapter_status_reset, append_only_revocation_record_if_previously_approved]
    - from: approved
      to: in_progress
      trigger: explicit_user_chapter_approval_revocation
      requires: [explicit_user_confirmation, append_only_revocation_record]
    - from: approved
      to: in_progress
      trigger: structure_change_invalidates_chapter
      requires: [explicit_user_confirmation, append_only_revocation_record]
  invariants:
    - all_sections_must_be_approved_before_assembly
    - chapter_approval_is_separate_from_section_approval
    - chapter_approval_requires_explicit_user_confirmation
    - adding_or_restructuring_sections_resets_chapter_to_in_progress
    - any_structural_change_invalidating_a_chapter_requires_chapter_status_in_progress
    - affected_chapter_approval_must_be_revoked_in_append_only_history

structure_changes:
  add_section:
    allowed_anytime: true
    preserve_existing_ids: true
    always_reset_chapter_status: in_progress
    invalidate_chapter_approval: true
    preserve_unaffected_section_approvals: true
  rename_or_reorder:
    preserve_stable_ids: true
    recalculate_visible_numbers: true
    invalidate_affected_chapter_approval: true
    reset_affected_chapter_status: in_progress
  move_section:
    preserve_section_id: true
    recalculate_visible_numbers: true
    invalidate_affected_chapter_approval: true
    reset_source_and_target_chapters_to: in_progress
    preserve_section_approval_only_if_manuscript_unchanged: true
  split_or_delete:
    require_explicit_confirmation: true
    preserve_previous_content_and_history: true
    never_permanently_discard_without_confirmation: true
    reset_affected_chapter_status: in_progress
    invalidate_affected_chapter_approval: true
    invalidate_changed_section_approvals: true
    retain_deleted_entity_history_and_ids: true

github_automation:
  issue_per_unit_of_work: false
  issue_creation: optional_or_explicitly_requested
  milestone_creation: optional_grouping_for_chapters_or_project_phases
  milestone_per_chapter_or_project_phase: true
  issue_must_include_when_created:
    - entity_id
    - current_status
    - target_status
    - task_type
    - applicable_instructions
    - required_inputs
    - acceptance_criteria
    - approval_gate_if_any
    - related_file_paths
  task_types: [research, brainstorming, outline, writing, revision, fact_check, chapter_assembly, chapter_review, approval, structure_change]
  approval_policy:
    github_issue_closure_is_not_user_approval: true
    milestone_completion_is_not_user_approval: true
    only_explicit_chat_confirmation_counts: true
  concurrency:
    require_expected_head_sha_for_writes: true
    require_idempotency_key_for_mutations: true
    never_claim_unconfirmed_write_success: true

audit:
  record_status_changes: true
  record_approval_actor_and_timestamp: true
  record_commit_sha_for_persisted_changes: true
  preserve_run_history: true
  preserve_prior_approved_versions: true
