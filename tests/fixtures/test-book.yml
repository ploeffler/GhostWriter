  title: "ADHS im Erwachsenenleben"
  title_short: "ADHS im Erwachsenenleben"
  author: "Erika Muster"
  description_short: "Ein Buch für Erwachsene, die ADHS spät bei sich entdecken und verstehen wollen, was hinter den alten Etiketten steckt."
