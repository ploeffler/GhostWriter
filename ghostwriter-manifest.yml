# GhostWriter – was zum Programm gehört und was dem Buch
#
# Ein Buch-Repository entsteht aus dem GhostWriter-Starter (Fork oder Template)
# und bekommt Updates automatisch aus dem Hauptrepository (`upstream`), siehe
# docs/UPDATES.md. Beim Update werden nur die Programmdateien unter `managed`
# durch den Stand von `upstream` ersetzt. Was unter `book` steht, gehört dem
# Buch und wird nie überschrieben. Alles andere bleibt unverändert.
#
# Lokale Änderungen an Programmdateien gehen beim nächsten Update verloren.
# Buchspezifisches gehört deshalb in ghostwriter.yml oder unter chapters/.

name: GhostWriter

# Programmversion. Wird beim Merge eines Versionsschritts nach main erhöht.
# Ein Buch wird nie auf eine ältere Version zurückgesetzt.
version: 0.6.0

upstream:
  repo: ploeffler/GhostWriter
  ref: main

# Programmdateien: beim Update vom Upstream übernommen (Ordner mit /)
managed:
  - START.md
  - README.md
  - CLAUDE.md                 # Einstieg für Claude (#136)
  - AGENTS.md                 # Einstieg für andere Assistenten (#136)
  - .claude/skills/ghostwriter/   # allgemeiner Skill; persönliche Skills daneben gehören dem Buch
  - ghostwriter-manifest.yml
  - workflow.yml
  - providers.yml
  - .gitattributes
  - .gitignore
  - docs/
  - schemas/
  - scripts/
  - templates/
  - assets/
  - .github/workflows/

# Gehören dem Buch; werden beim Update nie geändert (außer durch Migrationen
# in scripts/migrate_project.py und die Übersichtsdatei)
book:
  - ghostwriter.yml
  - approvals.yml
  - chapters/
  - matter/                 # Vor- und Nachspann: Widmung, Prolog, Epilog, Danksagung (#57)
  - cover/                  # Umschlag: Bilder und Rückseitentexte (#68)
  - characters/             # Figuren (#53)
  - story/                  # Schauplätze und Zeitleiste (#124)
  - costs/
  - research/
  - ghostwriter-index.json
  - library.json            # Bücherregal einer Bibliothek (Standard-Branch)
  - series/                 # Serien einer Bibliothek (Standard-Branch, #116)
  - analysis/               # Analysen im Hintergrund: Läufe, Vorschläge, Zwischenspeicher (#123)
  - import/                 # Manuskript-Import: Original, Umwandlung, Vorschlag (#124)
  - assistant.yml           # Assistenten-Profil (#136): Repo, Git-Benutzer, Autor, Stimme
  # Der persönliche Skill .claude/skills/<skill>/ (aus assistant.yml) steht absichtlich nicht
  # hier: Er gibt es nur im Buch, ein Update fasst ihn deshalb nie an; .claude/skills/ als
  # Ganzes hier aufzunehmen würde den allgemeinen Skill bei jedem Update zurücksetzen.
  - editions/
  - .ghostwriter/

# Bibliothek (#36): mehrere Bücher in einem Repository, je Buch ein Branch.
# Erkennungsregel und Namen: scripts/library.py. Im Bibliotheksmodus enthält der
# Standard-Branch nur Programm und Starter; Bücher werden nie dorthin gemergt.
library:
  book_prefix: buch/          # Buch-Branch: buch/<slug aus dem Kurztitel>
  work_prefix: ghostwriter/   # Arbeits-Branch: ghostwriter/<buch-branch>

update:
  # Liegt ein Buch als Branch im Hauptrepository selbst (z. B. das Testbuch),
  # werden diese Branches nie aktualisiert:
  skip_branches: [main, 'v*', 'ghostwriter/*', 'codex/*', 'claude/*', 'dependabot/*']
